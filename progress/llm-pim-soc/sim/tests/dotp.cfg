# dotp (rtl/l0/dotp.sv, AW = BW = 8) against k_dot8 through DPI-C (tb/dotp). Directed lane
# patterns (all -128 x -128, 127 x -128, one-hot extremes per lane, ...) and +N random
# (10^6 per parameter set in the full runs). LANES 8 (gemv) and 16 (PIM bank), plus 2 and
# 4; PIPE over the whole range 0..log2(LANES)+1. Quick tier: q runs with +N=100000.
TOP=tb_dotp
RTL_FILES="l0/dotp.sv"
TB_FILES="common/tb_util_pkg.sv dpi/kdpi_pkg.sv dotp/tb_dotp.sv"
DPI=1
RUNS=(
  "q8_p2|-gLANES=8 -gPIPE=2 +SEED=21 +N=100000|pass|q"
  "q16_p5|-gLANES=16 -gPIPE=5 +SEED=22 +N=100000|pass|q"
  "l8_p0|-gLANES=8 -gPIPE=0 +SEED=1 +N=1000000|pass"
  "l8_p1|-gLANES=8 -gPIPE=1 +SEED=2 +N=1000000|pass"
  "l8_p2|-gLANES=8 -gPIPE=2 +SEED=3 +N=1000000|pass"
  "l8_p3|-gLANES=8 -gPIPE=3 +SEED=4 +N=1000000|pass"
  "l8_p4|-gLANES=8 -gPIPE=4 +SEED=5 +N=1000000|pass"
  "l16_p0|-gLANES=16 -gPIPE=0 +SEED=6 +N=1000000|pass"
  "l16_p2|-gLANES=16 -gPIPE=2 +SEED=7 +N=1000000|pass"
  "l16_p5|-gLANES=16 -gPIPE=5 +SEED=8 +N=1000000|pass"
  "l2_p2|-gLANES=2 -gPIPE=2 +SEED=9 +N=1000000|pass"
  "l4_p1|-gLANES=4 -gPIPE=1 +SEED=10 +N=1000000|pass"
  "bad_lanes|-gLANES=6|elab_fail:dotp: LANES=6 must be a power of two|q"
  "bad_pipe|-gLANES=8 -gPIPE=5|elab_fail:dotp: PIPE=5 must be 0..4"
)
