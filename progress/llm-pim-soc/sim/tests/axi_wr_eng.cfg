# axi_wr_eng (rtl/l1/axi_wr_eng.sv, buffers rtl/l0/sync_fifo.sv) against the AXI slave memory
# model (tb/axi_wr_eng). Reference: memory contents (byte shadow of the random prefill plus
# every command's input bytes; per command at done with 8 guard bytes on each side, whole
# region at idle points), AW split rule, W data / WSTRB / WLAST per beat, W only after its AW,
# WVALID continuous inside a burst, outstanding limit, status outputs every cycle. The memory
# model's MAX_LEN is MAX_BURST - 1. PROF memory AW/W/B stalls and B latency, DGAP input gaps,
# GAP command gaps, BLK AW/W blocked (buffer must fill), OREACH outstanding limit must be
# reached, TPUT throughput (2: exactly 1 beat/cycle on W required), ERRINJ SLVERR/DECERR.
# NEG: one illegal command or input violation each.
TOP=tb_axi_wr_eng
RTL_FILES="l0/sync_fifo.sv l1/axi_wr_eng.sv"
TB_FILES="common/tb_util_pkg.sv common/axi_mem_slave.sv axi_wr_eng/tb_axi_wr_eng.sv"
DPI=0
RUNS=(
  "q_b16o4|+SEED=1 +PROF=1 +DGAP=20 +GAP=20|pass|q"
  "q_b16o4_tput|+SEED=2 +PROF=0 +DGAP=0 +GAP=0 +N_CMD=200 +TPUT=2 +OREACH=1|pass|q"
  "q_b16o4_blk|+SEED=3 +PROF=1 +DGAP=50 +GAP=0 +BLK=1 +ERRINJ=1|pass|q"
  "q_b256o2|-gMAX_BURST=256 -gOUTS=2 +SEED=4 +PROF=1 +DGAP=20 +BLK=1 +OREACH=1 +TPUT=1|pass|q"
  "b16o4_heavy|+SEED=5 +PROF=2 +DGAP=60 +GAP=0 +N_CMD=600|pass"
  "b16o4_gap|+SEED=6 +PROF=1 +DGAP=0 +GAP=60 +N_CMD=600 +ERRINJ=1|pass"
  "b1o1|-gMAX_BURST=1 -gOUTS=1 +SEED=7 +PROF=1 +DGAP=20 +N_CMD=150 +MAXB=8192 +TPUT=1 +OREACH=1 +BLK=1|pass"
  "b1o4|-gMAX_BURST=1 -gOUTS=4 +SEED=8 +PROF=1 +DGAP=20 +N_CMD=150 +MAXB=8192 +TPUT=1 +OREACH=1|pass"
  "b16o1|-gOUTS=1 +SEED=9 +PROF=1 +DGAP=20 +TPUT=1 +OREACH=1 +BLK=1|pass"
  "b16o2|-gOUTS=2 +SEED=10 +PROF=2 +DGAP=50 +BLK=1 +OREACH=1|pass"
  "b16o4_fd16|-gFIFO_DEPTH=16 +SEED=11 +PROF=1 +DGAP=20 +BLK=1 +OREACH=1 +TPUT=1|pass"
  "b16o4_fd21|-gFIFO_DEPTH=21 +SEED=15 +PROF=1 +DGAP=10 +BLK=1 +TPUT=1|pass"
  "b256o4|-gMAX_BURST=256 -gOUTS=4 +SEED=12 +PROF=2 +DGAP=20 +MAXB=65536 +BLK=1 +OREACH=1 +TPUT=2|pass"
  "b256o1_fd256|-gMAX_BURST=256 -gOUTS=1 -gFIFO_DEPTH=256 +SEED=13 +PROF=1 +DGAP=50 +BLK=1 +OREACH=1|pass"
  "b8o8|-gMAX_BURST=8 -gOUTS=8 +SEED=14 +PROF=1 +DGAP=20 +ERRINJ=1 +OREACH=1 +TPUT=1|pass"
  "neg_hold|+SEED=21 +PROF=1 +N_CMD=20 +NEG=1|assert:VR_HOLD=1|q"
  "neg_stable|+SEED=22 +PROF=1 +N_CMD=20 +NEG=2|assert:VR_STABLE=1"
  "neg_align|+SEED=23 +PROF=1 +N_CMD=20 +NEG=3|assert:ENG_CMD=1|q"
  "neg_zero|+SEED=24 +PROF=1 +N_CMD=20 +NEG=4|assert:ENG_CMD=1"
  "neg_wrap|+SEED=25 +PROF=1 +N_CMD=20 +NEG=5|assert:ENG_CMD=1"
  "neg_in_hold|+SEED=26 +PROF=1 +N_CMD=20 +NEG=6|assert:VR_HOLD=1"
  "bad_burst0|-gMAX_BURST=0|elab_fail:axi_wr_eng: MAX_BURST=0 must be 1..256|q"
  "bad_burst257|-gMAX_BURST=257|elab_fail:axi_wr_eng: MAX_BURST=257 must be 1..256"
  "bad_outs0|-gOUTS=0|elab_fail:axi_wr_eng: OUTS=0 must be 1..64"
  "bad_fifo|-gFIFO_DEPTH=8|elab_fail:axi_wr_eng: FIFO_DEPTH=8 must be >= MAX_BURST=16"
)
