# ram_sdp (rtl/l0/ram_sdp.sv) against an array reference model (tb/ram_sdp): fill, then
# random reads and writes with same-address read/write (read-first), RD_LAT 1 and 2,
# DEPTH power of two (x buffer 64 x 128) and not, 72-bit width. Negative runs (DEPTH 1000)
# expect exactly one assertion message of their tag.
TOP=tb_ram_sdp
RTL_FILES="l0/ram_sdp.sv"
TB_FILES="common/tb_util_pkg.sv ram_sdp/tb_ram_sdp.sv"
DPI=0
RUNS=(
  "w64d128l1|-gW=64 -gDEPTH=128 -gRD_LAT=1 +SEED=1|pass|q"
  "w72d1000l2|-gW=72 -gDEPTH=1000 -gRD_LAT=2 +SEED=2|pass|q"
  "w64d128l2|-gW=64 -gDEPTH=128 -gRD_LAT=2 +SEED=3|pass"
  "w32d4096l1|-gW=32 -gDEPTH=4096 -gRD_LAT=1 +SEED=4 +N=400000|pass"
  "w8d2l1|-gW=8 -gDEPTH=2 -gRD_LAT=1 +SEED=5|pass"
  "neg_waddr|-gW=16 -gDEPTH=1000 +SEED=6 +N=20000 +NEG=1|assert:RAM_ADDR=1|q"
  "neg_raddr|-gW=16 -gDEPTH=1000 +SEED=7 +N=20000 +NEG=2|assert:RAM_ADDR=1"
  "neg_x|-gW=16 -gDEPTH=1000 +SEED=8 +N=20000 +NEG=3|assert:RAM_X=1"
  "bad_lat|-gRD_LAT=3|elab_fail:ram_sdp: RD_LAT=3 must be 1 or 2|q"
)
