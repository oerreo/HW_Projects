# sys_p_top (rtl/l4/sys_p_top.sv, build P of docs/spec/system.md 1.2: axil_xbar + pim_top + attn_top
# H_PAR 2 BRAM KV HS_MAX 8 + vec_top) with the smoke testbench tb/sys_top/tb_sys_top.sv (BUILD 1):
# ID / CONFIG / CONFIG2 / CONFIG3 of all 16 slots, one call per IP against the golden model (pim LDW +
# WRGB + MACAB in one RUN: kd_bank_syn y and bank_stat counters; attn: 260K K_ATTN2 records of position
# 0 (all layers, KVW first) and position 1 layer 0, q records only in the memory of the serving
# engine's HP port (HP1 / HP2); vec: ACTQ and ARGMAX), HP port assignment, HP2 write tied off.
# VAR 1 = build PD (AT_KV_SRC 1: DDR KV of kv head j only in the memory of HP 1 + j mod 2),
# VAR 2 = XB_REG 0.
TOP=tb_sys_top
RTL_FILES="pkg/llm_pkg.sv pkg/lut_pkg.sv l0/rshr_sat.sv l0/dotp.sv l0/sync_fifo.sv l0/ram_sdp.sv l0/udiv_seq.sv l0/umul_seq.sv l0/lut_lerp.sv l0/argmax_red.sv l0/rsqrt_nr.sv l1/mac_row.sv l1/gemv_scale.sv l1/exp_unit.sv l1/attn_score.sv l1/attn_vacc.sv l1/actq_core.sv l1/rms_front.sv l1/swi_front.sv l1/axil_slave.sv l1/axi_rd_eng.sv l1/axi_wr_eng.sv l1/pim_gb.sv l1/pim_bank.sv l1/pim_ctrl.sv l2/gemv_core.sv l2/pim_core.sv l2/attn_core.sv l2/kv_store.sv l2/kv_rd.sv l2/vec_core.sv l3/gemv_acc_csr.sv l3/gemv_acc_top.sv l3/pim_csr.sv l3/pim_top.sv l3/attn_csr.sv l3/attn_top.sv l3/vec_csr.sv l3/vec_top.sv l4/axil_xbar.sv l4/sys_a_top.sv l4/sys_p_top.sv"
TB_FILES="common/tb_util_pkg.sv common/axi_mem_slave.sv common/axil_bfm.sv dpi/kdpi_pkg.sv common/attn_tb_pkg.sv common/vec_tb_pkg.sv sys_top/tb_sys_top.sv"
DPI=1
NEED="model/build/vec/m1/attn2.bin"
M1="+VEC_AT=../../model/build/vec/m1"
RUNS=(
  "q_p|-gBUILD=1 +SEED=11 +MAXD=1 $M1|pass|q"
  "q_pd|-gBUILD=1 -gVAR=1 +SEED=12 +MAXD=2 $M1|pass|q"
  "p_xb0|-gBUILD=1 -gVAR=2 +SEED=13 +MAXD=3 $M1|pass"
  "p_seed14|-gBUILD=1 +SEED=14 +MAXD=0 $M1 +NGRP=11|pass"
  "p_bad_hpar|-gBUILD=1 -gAT_H_PAR=3|elab_fail:sys_p_top: AT_H_PAR=3 must be 1 or 2|q"
)
