# vec_csr (rtl/l3/vec_csr.sv) alone against a register-file model written from docs/spec/vec.md 3
# and 4 (tb/vec_csr): directed calls (a legal descriptor of every op; every BAD_DESC reason alone
# with its first illegal and last legal value; every byte range ending exactly at 2^32 and 8 bytes
# beyond; unused fields and addresses; every MISALIGN; BAD_DESC with MISALIGN; BAD_OP; START_BUSY in
# the verdict cycle and during the op; CTRL in the done cycle; descriptor writes in the verdict
# cycle; W1C against a set), then random strobes and events every cycle. Every cycle: read data of
# any address, start_o (verdict s + 1), busy_o, latched descriptor outputs, internal state.
TOP=tb_vec_csr
RTL_FILES="pkg/llm_pkg.sv l3/vec_csr.sv"
TB_FILES="common/tb_util_pkg.sv vec_csr/tb_vec_csr.sv"
DPI=0
RUNS=(
  "q_def|+SEED=1 +N_CYC=300000 +PDONE=5 +PEV=20|pass|q"
  "long|+SEED=2 +N_CYC=2000000 +PDONE=2 +PEV=10|pass"
  "busy|+SEED=3 +N_CYC=1000000 +PDONE=1 +PEV=40|pass"
  "nmax64_idx8|-gN_MAX=64 -gIDX_W=8 +SEED=4 +N_CYC=500000 +PDONE=5 +PEV=20|pass"
  "nmax1000|-gN_MAX=1000 -gIDX_W=10 +SEED=5 +N_CYC=500000 +PDONE=5 +PEV=20|pass"
  "bad_idx|-gN_MAX=1024 -gIDX_W=9|elab_fail:vec_csr: IDX_W=9 must be 1..30 with 2^IDX_W >= N_MAX|q"
)
