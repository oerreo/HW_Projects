# attn_top (rtl/l3/attn_top.sv with attn_csr, attn_core and its leaves, kv_store or kv_rd,
# axil_slave, axi_rd_eng x H_PAR, axi_wr_eng) over AXI4-Lite (tb/common/axil_bfm.sv) and AXI memory
# models (tb/attn_top). K_ATTN2 records of 260K (m1: 12 positions, T 1..512, hs 8, 8 heads, kv 4)
# and 15M (m2: 6 positions, T 1..256, hs 48, 6 heads, kv 6). KV_SRC 0: forward order per position
# and layer: KVW of every new position (golden layout source buffers) then ATTN (head ranges split
# at random); KV_SRC 1: DDR cache in the golden layout. o (and p when p_en) == record outputs,
# guards, ERR, per-cycle CSR reference model (start acceptance with an independent descriptor
# check, ERR, done_sticky, counters, read data). ERR runs: every ERR cause and recovery. MSTALL /
# WBLK: memory stalls, long write blocks (write buffer, packer and output credit limits reached).
# H_PAR 1 and 2, PIPE defaults.
TOP=tb_attn_top
RTL_FILES="pkg/llm_pkg.sv pkg/lut_pkg.sv l0/rshr_sat.sv l0/dotp.sv l0/ram_sdp.sv l0/sync_fifo.sv l0/udiv_seq.sv l0/umul_seq.sv l0/lut_lerp.sv l1/exp_unit.sv l1/attn_score.sv l1/attn_vacc.sv l1/axil_slave.sv l1/axi_rd_eng.sv l1/axi_wr_eng.sv l2/attn_core.sv l2/kv_store.sv l2/kv_rd.sv l3/attn_csr.sv l3/attn_top.sv"
TB_FILES="common/tb_util_pkg.sv common/axi_mem_slave.sv common/axil_bfm.sv dpi/kdpi_pkg.sv common/attn_tb_pkg.sv attn_top/tb_attn_top.sv"
DPI=1
V=../../model/build/vec
NEED="model/build/vec/m1/attn2.bin model/build/vec/m2/attn2.bin"
B1="-gKV_SRC=0 -gHS_MAX=8 -gTMAX=512 -gNKV=4 -gNL=5 +VEC=$V/m1 +NH=8 +NKV=4 +SEQ=512"
D2="-gKV_SRC=1 -gHS_MAX=64 -gTMAX=512 +VEC=$V/m2 +NH=6 +NKV=6 +SEQ=256"
D1="-gKV_SRC=1 -gHS_MAX=8 -gTMAX=512 +VEC=$V/m1 +NH=8 +NKV=4 +SEQ=512"
RUNS=(
  "q_bram_hp2|-gH_PAR=2 $B1 +SEED=1 +MAXPOS=8 +RND=1|pass|q"
  "q_ddr_hp1|-gH_PAR=1 $D2 +SEED=2 +MAXPOS=4|pass|q"
  "q_bram_err|-gH_PAR=2 -gOUT_DEPTH=4 $B1 +SEED=3 +MAXPOS=64 +ERR=1 +WBLK=1|pass|q"
  "q_ddr_err_stall|-gH_PAR=2 -gOUT_DEPTH=4 $D2 +SEED=4 +MAXPOS=4 +ERR=1 +MSTALL=1 +WBLK=1|pass|q"
  "bram_hp2_tok|-gH_PAR=2 $B1 +SEED=11 +SPLIT=0 +PEN=0|pass"
  "bram_hp1_tok|-gH_PAR=1 $B1 +SEED=12 +SPLIT=0 +PEN=0|pass"
  "bram_hp2_tok_pen|-gH_PAR=2 $B1 +SEED=19 +SPLIT=0 +PEN=1|pass"
  "bram_hp2_stall|-gH_PAR=2 $B1 +SEED=13 +MSTALL=1 +WBLK=1 +RND=1 +MAXD=2|pass"
  "bram_hp1_err|-gH_PAR=1 -gOUT_DEPTH=4 $B1 +SEED=14 +MAXPOS=64 +ERR=1 +WBLK=1|pass"
  "ddr_m2_hp2_tok|-gH_PAR=2 $D2 +SEED=15 +SPLIT=0 +PEN=0|pass"
  "ddr_m2_hp1_tok|-gH_PAR=1 $D2 +SEED=20 +SPLIT=0 +PEN=0|pass"
  "ddr_m2_hp1_stall|-gH_PAR=1 $D2 +SEED=16 +MSTALL=1 +WBLK=1 +RND=1|pass"
  "ddr_m1_hp2|-gH_PAR=2 $D1 +SEED=17 +MAXPOS=128|pass"
  "ddr_m1_hp1_err|-gH_PAR=1 $D1 +SEED=18 +MAXPOS=64 +ERR=1 +MSTALL=1|pass"
  "bad_hpar|-gH_PAR=3 $B1|elab_fail:attn_top: H_PAR=3 must be 1, 2 or 4"
)
