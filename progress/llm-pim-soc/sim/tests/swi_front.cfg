# swi_front (rtl/l1/swi_front.sv with lut_lerp SIGM, rshr_sat) with its buffer (ram_sdp) and the
# shared actq_core (f = 16, qmax 127) against k_swiglu_st through DPI-C (tb/swi_front): every
# K_SWIGLU record of both models (260K 60 calls n 172, 15M 36 calls n 768; LUT k_sig_lut(8)),
# synthetic calls (n 1..N_MAX, h1 of every magnitude incl. sigmoid saturation and -2^31, h3 extremes
# reaching the 62-bit clamp, zero); silu in the buffer, every g, q and scale {m, e}, actq M / R / e;
# cycle formula without stalls; element gaps, q_ready stalls and long blocks (q FIFO full required).
TOP=tb_swi_front
RTL_FILES="pkg/llm_pkg.sv pkg/lut_pkg.sv l0/rshr_sat.sv l0/udiv_seq.sv l0/ram_sdp.sv l0/sync_fifo.sv l0/lut_lerp.sv l1/actq_core.sv l1/swi_front.sv"
TB_FILES="common/tb_util_pkg.sv dpi/kdpi_pkg.sv common/vec_tb_pkg.sv swi_front/tb_swi_front.sv"
DPI=1
NEED="model/build/vec/m1/swiglu.bin model/build/vec/m2/swiglu.bin"
RUNS=(
  "q_cyc|+SEED=1 +VEC1=../../model/build/vec/m1 +VEC2=../../model/build/vec/m2 +NSYN=100 +CYC=1|pass|q"
  "q_stall|+SEED=2 +VEC1=../../model/build/vec/m1 +NSYN=100 +GAP=20 +QSTALL=30 +QBLK=1|pass|q"
  "rec_stall|+SEED=3 +VEC1=../../model/build/vec/m1 +VEC2=../../model/build/vec/m2 +GAP=30 +QSTALL=40 +QBLK=1|pass"
  "syn_cyc|+SEED=4 +NSYN=1500 +CYC=1|pass"
  "syn_stall|+SEED=5 +NSYN=1500 +GAP=10 +QSTALL=50 +QBLK=1|pass"
  "nmax64|-gN_MAX=64 +SEED=6 +NSYN=2000 +GAP=10 +QSTALL=30 +QBLK=1|pass"
)
