# actq_core (rtl/l1/actq_core.sv with udiv_seq, rshr_sat, ram_sdp, sync_fifo) against k_actq_st
# through DPI-C (tb/actq_core, tb/common/vec_tb_pkg.sv): every K_ACTQ record of both models (260K
# 1,020 calls, n 8 / 64; 15M 684 calls, n 8 / 48 / 288; qmax 127 and 2047), synthetic calls (n 1 ..
# N_MAX, qmax 127 / 2047 / 32767, f random, amax 0, 1, 2^31 - 1, 2^31, equal magnitudes, saturation),
# q, scale {m, e} and the stage trace (amax, L, e, num, M, R); cycle formula without stalls;
# input gaps, q_ready stalls, long q_ready blocks (output FIFO full and credit stop required),
# back-to-back starts in the done cycle.
TOP=tb_actq_core
RTL_FILES="pkg/llm_pkg.sv l0/rshr_sat.sv l0/udiv_seq.sv l0/ram_sdp.sv l0/sync_fifo.sv l1/actq_core.sv"
TB_FILES="common/tb_util_pkg.sv dpi/kdpi_pkg.sv common/vec_tb_pkg.sv actq_core/tb_actq_core.sv"
DPI=1
NEED="model/build/vec/m1/actq.bin model/build/vec/m2/actq.bin"
RUNS=(
  "q_cyc|+SEED=1 +VEC1=../../model/build/vec/m1 +VEC2=../../model/build/vec/m2 +MAXREC=200 +NSYN=200 +CYC=1 +B2B=1|pass|q"
  "q_stall|+SEED=2 +VEC2=../../model/build/vec/m2 +MAXREC=100 +NSYN=200 +GAP=20 +QSTALL=30 +QBLK=1|pass|q"
  "rec_cyc|+SEED=3 +VEC1=../../model/build/vec/m1 +VEC2=../../model/build/vec/m2 +CYC=1|pass"
  "rec_stall|+SEED=4 +VEC1=../../model/build/vec/m1 +VEC2=../../model/build/vec/m2 +GAP=30 +QSTALL=40 +QBLK=1|pass"
  "syn_cyc|+SEED=5 +NSYN=3000 +CYC=1|pass"
  "syn_stall|+SEED=6 +NSYN=3000 +GAP=10 +QSTALL=50 +QBLK=1|pass"
  "nmax64_qd5|-gN_MAX=64 -gQ_DEPTH=5 +SEED=7 +NSYN=2000 +GAP=10 +QSTALL=60 +QBLK=1|pass"
  "bad_qdepth|-gQ_DEPTH=4|elab_fail:actq_core: Q_DEPTH=4 must be >= 5|q"
)
