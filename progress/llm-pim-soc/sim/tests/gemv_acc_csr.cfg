# gemv_acc_csr (rtl/l3/gemv_acc_csr.sv) alone against a register-file model written from
# docs/spec/gemv_acc.md (tb/gemv_acc_csr): random write / read strobes every cycle (any
# address incl. unused ones and unaligned byte addresses, legal and illegal descriptors, CTRL
# with start 0/1 and op 0..15, ERR W1C), random events (done_i while busy, RRESP/BRESP errors,
# stall flags, argmax done). Every cycle: rd_data_o, start_o, busy_o, latched op_* outputs.
# Coverage counted and required: starts, START_BUSY (also with an illegal op), CTRL write in
# the done cycle with start 0 and 1, W1C against a set of the same bit, every ERR bit.
TOP=tb_gemv_acc_csr
RTL_FILES="pkg/llm_pkg.sv l3/gemv_acc_csr.sv"
TB_FILES="common/tb_util_pkg.sv gemv_acc_csr/tb_gemv_acc_csr.sv"
DPI=0
RUNS=(
  "q_rnd|+SEED=1 +N_CYC=200000 +PDONE=5 +PEV=30|pass|q"
  "q_p2|-gP=2 +SEED=2 +N_CYC=200000 +PDONE=20 +PEV=60|pass|q"
  "rnd_long|+SEED=3 +N_CYC=2000000 +PDONE=2 +PEV=10|pass"
  "nmax64|-gNMAX=64 +SEED=4 +N_CYC=500000 +PDONE=10 +PEV=30|pass"
  "bad_nmax|-gNMAX=4|elab_fail:gemv_acc_csr: NMAX=4 must be 8..65535|q"
)
