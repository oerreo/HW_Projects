# vec_core (rtl/l2/vec_core.sv: unpacker, shared front buffer, rms_front, swi_front, actq_core,
# argmax_red) against the golden model through DPI-C (tb/vec_core), the TB playing the read engine:
# every K_RMSNORM, K_SWIGLU, K_ACTQ and K_ARGMAX record of both models (ops interleaved; 15M ARGMAX
# n 32000), synthetic calls of every op (n 1..N_MAX, ARGMAX ties and n up to AMAXN); q, scale, argmax
# index and value; cycle formula of every op without stalls; beat gaps, q_ready stalls and long
# blocks (q FIFO full required), starts in the done cycle.
TOP=tb_vec_core
RTL_FILES="pkg/llm_pkg.sv pkg/lut_pkg.sv l0/rshr_sat.sv l0/udiv_seq.sv l0/ram_sdp.sv l0/sync_fifo.sv l0/rsqrt_nr.sv l0/lut_lerp.sv l0/argmax_red.sv l1/actq_core.sv l1/rms_front.sv l1/swi_front.sv l2/vec_core.sv"
TB_FILES="common/tb_util_pkg.sv dpi/kdpi_pkg.sv common/vec_tb_pkg.sv vec_core/tb_vec_core.sv"
DPI=1
NEED="model/build/vec/m1/argmax.bin model/build/vec/m2/argmax.bin model/build/vec/m1/actq.bin model/build/vec/m2/actq.bin"
RUNS=(
  "q_cyc|+SEED=1 +VEC1=../../model/build/vec/m1 +VEC2=../../model/build/vec/m2 +MAXREC=12 +NSYN=100 +CYC=1|pass|q"
  "q_stall|+SEED=2 +VEC1=../../model/build/vec/m1 +MAXREC=20 +NSYN=100 +GAP=20 +QSTALL=30 +QBLK=1|pass|q"
  "rec_cyc|+SEED=3 +VEC1=../../model/build/vec/m1 +VEC2=../../model/build/vec/m2 +CYC=1|pass"
  "rec_stall|+SEED=4 +VEC1=../../model/build/vec/m1 +VEC2=../../model/build/vec/m2 +GAP=30 +QSTALL=40 +QBLK=1|pass"
  "syn_cyc|+SEED=5 +NSYN=2000 +CYC=1 +AMAXN=65536|pass"
  "syn_stall|+SEED=6 +NSYN=2000 +GAP=15 +QSTALL=50 +QBLK=1|pass"
  "nmax64_idx8|-gN_MAX=64 -gIDX_W=8 -gQ_DEPTH=5 +SEED=7 +NSYN=2000 +AMAXN=256 +GAP=10 +QSTALL=30 +QBLK=1|pass"
  "bad_idx|-gN_MAX=1024 -gIDX_W=9|elab_fail:vec_core: 2^IDX_W must be >= N_MAX|q"
)
