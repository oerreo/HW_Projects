# pim_bank (rtl/l1/pim_bank.sv with l1/mac_row, l0/dotp, l0/ram_sdp) alone (tb/pim_bank).
# Every 260K K_GEMV record (12 positions x 36 matrices) is packed by bimg_pack (DPI kd_rec_bimg,
# 4 banks) and each of the 4 bank images is written at a random base of the DUT bank; the RAM is
# compared with the image (backdoor, words outside the image keep their random prefill), then
# every row of that bank is MACed with the record's x: row sum == k_dot8 (kd_rec_gemv_acc), row
# mantissa == m[r], result exactly LATENCY = 3 + DOT_PIPE cycles after the last word.
# SYN: synthetic rows (n 1..1024, garbage in lanes >= n and in non-first tags, all -128 x -127).
TOP=tb_pim_bank
RTL_FILES="pkg/llm_pkg.sv l0/dotp.sv l0/ram_sdp.sv l1/mac_row.sv l1/pim_bank.sv"
TB_FILES="common/tb_util_pkg.sv dpi/kdpi_pkg.sv pim_bank/tb_pim_bank.sv"
DPI=1
NEED="model/build/vec/m1/gemv.bin"
M1="+VEC=../../model/build/vec/m1"
RUNS=(
  "q_m1|+SEED=1 $M1 +MAXREC=36 +GAP=0|pass|q"
  "q_syn|+SEED=2 +SYN=300 +GAP=30|pass|q"
  "m1_all|+SEED=3 $M1 +GAP=0|pass"
  "m1_gap|+SEED=4 $M1 +GAP=40 +SYN=200|pass"
  "p0_syn|-gDOT_PIPE=0 +SEED=5 +SYN=400 +GAP=20 $M1 +MAXREC=36|pass"
  "p5_syn|-gDOT_PIPE=5 +SEED=6 +SYN=400 +GAP=20 $M1 +MAXREC=36|pass"
  "bad_lb|-gDEPTH=1|elab_fail:pim_bank: DEPTH=1 must be >= 2|q"
)
