# AXI slave memory model self-test (tb/axi_mem/tb_axi_mem.sv, model tb/common/axi_mem_slave.sv).
# Random INCR bursts with random IDs, VALID gaps, READY backpressure and latency
# (+PROF 0 none, 1 moderate, 2 heavy), W ahead of AW, partial WSTRB, file round trips.
# Negative runs inject one protocol violation each (+NEG) and expect exactly one message
# of its tag, data checks still PASS. Quick tier (sim/run.sh quick): runs marked q.
TOP=tb_axi_mem
RTL_FILES=""
TB_FILES="common/tb_util_pkg.sv common/axi_mem_slave.sv axi_mem/tb_axi_mem.sv"
DPI=0
RUNS=(
  "nostall|+SEED=1 +PROF=0|pass|q"
  "stall|+SEED=2 +PROF=1|pass|q"
  "heavy|+SEED=3 +PROF=2|pass"
  "axi4len|-gMAX_LEN=255 +SEED=4 +PROF=1 +MAXL=255 +N_BURST=60|pass"
  "neg_hold|+SEED=5 +PROF=1 +N_ROUND=2 +NEG=1|assert:AXI_HOLD=1|q"
  "neg_stable|+SEED=6 +PROF=1 +N_ROUND=2 +NEG=2|assert:AXI_STABLE=1"
  "neg_len|+SEED=7 +PROF=1 +N_ROUND=2 +NEG=3|assert:AXI_LEN=1"
  "neg_4k_rd|+SEED=8 +PROF=1 +N_ROUND=2 +NEG=4|assert:AXI_4K=1"
  "neg_4k_wr|+SEED=9 +PROF=1 +N_ROUND=2 +NEG=5|assert:AXI_4K=1"
  "neg_wlast|+SEED=10 +PROF=1 +N_ROUND=2 +NEG=6|assert:AXI_WLAST=1|q"
  "neg_burst|+SEED=11 +PROF=1 +N_ROUND=2 +NEG=7|assert:AXI_BURST=1"
  "neg_align|+SEED=12 +PROF=1 +N_ROUND=2 +NEG=8|assert:AXI_ALIGN=1"
  "neg_x|+SEED=13 +PROF=1 +N_ROUND=2 +NEG=9|assert:AXI_X=1"
  "neg_idle|+SEED=14 +PROF=1 +N_ROUND=2 +NEG=10|assert:AXI_IDLE=1"
  "bad_dw|-gDW=48|elab_fail:axi_mem_slave: DW=48"
  "bad_len|-gMAX_LEN=256|elab_fail:axi_mem_slave: MAX_LEN=256"
)
