# axil_xbar (rtl/l4/axil_xbar.sv, S5-2) with tb/axil_xbar/tb_axil_xbar.sv: AXI4-Lite master driver
# (independent write and read processes, AW / W orders and gaps, back-to-back, long response
# backpressure) against N slave response models (random READY, long blocks, random delays and
# BRESP / RRESP / RDATA); every transaction checked against a reference decode (port, offset, data,
# WSTRB, PROT, response, absent slot / out of range -> OKAY and read 0, no slave access), one
# transaction per channel on the slave side, the cycle rules of REG 1 / REG 0, VALID / payload hold
# on both sides, coverage. Defaults: N 4, SLOT_W 4, S_ADDR_W 16, SLOT_EN all, REG 1.
# SLOT_EN 13 = 0b1101 (build A: slot 1 absent), 14 = 0b1110 (build P: slot 0 absent).
# neg_*: protocol violations injected k times, the xbar assertion must fire exactly k times.
# perf_*: XB_PERF lines (period of back-to-back transactions, latency).
TOP=tb_axil_xbar
RTL_FILES="l4/axil_xbar.sv"
TB_FILES="common/tb_util_pkg.sv axil_xbar/tb_axil_xbar.sv"
DPI=0
RUNS=(
  "q_reg1|-gREG=1 +SEED=1 +N_WR=3000 +N_RD=3000|pass|q"
  "q_reg0|-gREG=0 +SEED=2 +N_WR=3000 +N_RD=3000|pass|q"
  "q_a_reg1|-gREG=1 -gS_ADDR_W=32 -gSLOT_EN=13 +SEED=3 +N_WR=3000 +N_RD=3000|pass|q"
  "q_p_reg0|-gREG=0 -gS_ADDR_W=32 -gSLOT_EN=14 +SEED=4 +N_WR=3000 +N_RD=3000|pass|q"
  "q_perf1|-gREG=1 +SEED=5 +N_WR=200 +N_RD=200 +PERF=1|pass|q"
  "q_perf0|-gREG=0 +SEED=6 +N_WR=200 +N_RD=200 +PERF=1|pass|q"
  "q_neg_aw1|-gREG=1 +SEED=7 +N_WR=500 +N_RD=500 +NEG_AW=5|assert:L4_XB_AW=5|q"
  "q_neg_r0|-gREG=0 +SEED=8 +N_WR=500 +N_RD=500 +NEG_R=4|assert:L4_XB_R=4,TB_XB_HOLD=4|q"
  "q_badn|-gN=17|elab_fail:axil_xbar: N=17 must be 1..2^SLOT_W|q"
  "reg1_long|-gREG=1 -gS_ADDR_W=32 +SEED=11 +N_WR=20000 +N_RD=20000 +MAXD=6 +SMAXD=6 +LONG=40|pass"
  "reg0_long|-gREG=0 -gS_ADDR_W=32 +SEED=12 +N_WR=20000 +N_RD=20000 +MAXD=6 +SMAXD=6 +LONG=40|pass"
  "reg1_b2b|-gREG=1 -gSLOT_EN=13 +SEED=13 +N_WR=20000 +N_RD=20000 +MAXD=1 +SMAXD=1 +B2B=80 +LONG=5|pass"
  "reg0_b2b|-gREG=0 -gSLOT_EN=14 +SEED=14 +N_WR=20000 +N_RD=20000 +MAXD=1 +SMAXD=0 +B2B=80 +LONG=5|pass"
  "reg1_seq|-gREG=1 -gS_ADDR_W=20 +SEED=15 +N_WR=10000 +N_RD=10000 +CONC=0|pass"
  "reg0_seq|-gREG=0 -gS_ADDR_W=20 +SEED=16 +N_WR=10000 +N_RD=10000 +CONC=0|pass"
  "n16_reg1|-gN=16 -gREG=1 -gS_ADDR_W=24 +SEED=17 +N_WR=10000 +N_RD=10000|pass"
  "n16_reg0|-gN=16 -gREG=0 +SEED=18 +N_WR=10000 +N_RD=10000|pass"
  "n1_reg1|-gN=1 -gSLOT_W=1 -gS_ADDR_W=13 -gREG=1 +SEED=19 +N_WR=5000 +N_RD=5000|pass"
  "n5_reg0|-gN=5 -gSLOT_W=3 -gS_ADDR_W=32 -gSLOT_EN=22 -gREG=0 +SEED=20 +N_WR=10000 +N_RD=10000|pass"
  "neg_w1|-gREG=1 +SEED=21 +N_WR=500 +N_RD=500 +NEG_W=5|assert:L4_XB_W=5"
  "neg_ar1|-gREG=1 +SEED=22 +N_WR=500 +N_RD=500 +NEG_AR=5|assert:L4_XB_AR=5"
  "neg_aw0|-gREG=0 +SEED=23 +N_WR=500 +N_RD=500 +NEG_AW=5|assert:L4_XB_AW=5"
  "neg_w0|-gREG=0 +SEED=24 +N_WR=500 +N_RD=500 +NEG_W=5|assert:L4_XB_W=5"
  "neg_ar0|-gREG=0 +SEED=25 +N_WR=500 +N_RD=500 +NEG_AR=5|assert:L4_XB_AR=5"
  "badn0|-gN=0|elab_fail:axil_xbar: N=0 must be 1..2^SLOT_W"
  "badslotw|-gSLOT_W=5|elab_fail:axil_xbar: SLOT_W=5 not supported"
  "badaddr15|-gS_ADDR_W=15|elab_fail:axil_xbar: S_ADDR_W=15 must be"
  "badaddr33|-gS_ADDR_W=33|elab_fail:axil_xbar: S_ADDR_W=33 must be"
  "badreg|-gREG=2|elab_fail:axil_xbar: REG=2 must be 0 or 1"
  "baden|-gN=2 -gSLOT_EN=7|elab_fail:axil_xbar: SLOT_EN=0x7 has bits at or above N=2"
)
