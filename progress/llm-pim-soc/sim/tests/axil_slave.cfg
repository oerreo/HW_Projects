# axil_slave (rtl/l1/axil_slave.sv, copied from pqc-ntt-ip rtl/l4) with its copied testbench
# (tb/axil_slave/tb_axil_slave.sv): AXI4-Lite channel handling against a register-side memory
# model (read data = function of address and read count), cycle reference model, scoreboards,
# latency rule, random resets. Same runs as in pqc-ntt-ip (sim/tests/l4_axil_slave.cfg there).
# a12 / a32 / a3 = ADDR_W; bad*: illegal parameters rejected at elaboration.
TOP=tb_axil_slave
RTL_FILES="l1/axil_slave.sv"
TB_FILES="common/tb_util_pkg.sv axil_slave/tb_axil_slave.sv"
DPI=0
RUNS=(
  "a12|-gADDR_W=12 +SEED=501 +N_WR=60000 +N_RD=60000|pass"
  "a32|-gADDR_W=32 +SEED=502 +N_WR=60000 +N_RD=60000|pass"
  "a3|-gADDR_W=3 +SEED=503 +N_WR=60000 +N_RD=60000 +RST_PERMIL=10|pass"
  "q|-gADDR_W=12 +SEED=504 +N_WR=6000 +N_RD=6000 +RST_PERMIL=10 +PROF_LEN=500|pass|q"
  "badaddr2|-gADDR_W=2|elab_fail:axil_slave: ADDR_W=2 not supported|q"
  "badaddr33|-gADDR_W=33|elab_fail:axil_slave: ADDR_W=33 not supported"
  "baddata|-gDATA_W=64|elab_fail:axil_slave: DATA_W=64 not supported|q"
)
