# attn_core (rtl/l2/attn_core.sv with l1/attn_score, l1/exp_unit, l1/attn_vacc, l0/udiv_seq,
# l0/lut_lerp, l0/dotp, l0/rshr_sat, l0/ram_sdp, l0/sync_fifo) against k_attn2_st (tb/attn_core,
# tb/common/attn_tb_pkg.sv). Output stream p[T] (p_en random) + o[hs] == golden, stage trace
# (s, mx, e, sum, R, G, emin, w, acc) white-box. Every K_ATTN2 record of 260K (480: 12 positions,
# T 1..512, hs 8) and 15M (216: 6 positions, T 1..256, hs 48), every K_ATTN record of the HB
# (K8V8) and HD (K16V16) dumps (260K 280, 15M 144), synthetic calls (gen_syn: random, equal
# scores, saturation / clamp, all vs.m = 0, extreme exponents, T / hs at the limit, hs not a
# multiple of 8). nostall runs: cycle count of every call == (T+1) ceil(hs/8) + T +
# T ceil(hs/8) + hs + C0. stall runs: random q / KV gaps, request delays, out_ready, long output
# blocks (credit limit must be reached). PIPE sets and OUT_DEPTH 4.
TOP=tb_attn_core
RTL_FILES="pkg/llm_pkg.sv pkg/lut_pkg.sv l0/rshr_sat.sv l0/dotp.sv l0/ram_sdp.sv l0/sync_fifo.sv l0/udiv_seq.sv l0/lut_lerp.sv l1/exp_unit.sv l1/attn_score.sv l1/attn_vacc.sv l2/attn_core.sv"
TB_FILES="common/tb_util_pkg.sv dpi/kdpi_pkg.sv common/attn_tb_pkg.sv attn_core/tb_attn_core.sv"
DPI=1
V=../../model/build/vec
NEED="model/build/vec/m1/attn2.bin model/build/vec/m2/attn2.bin model/build/vec/hb1/attn.bin model/build/vec/hd1/attn.bin model/build/vec/hb2/attn.bin model/build/vec/hd2/attn.bin"
RUNS=(
  "q_m1m2_nostall|+SEED=1 +VEC=$V/m1,$V/m2 +MAXREC=60 +STALL=0|pass|q"
  "q_syn_stall|+SEED=2 +SYN=60 +STALL=1 +OBLK=1|pass|q"
  "q_neg_start|+SEED=3 +SYN=4 +STALL=0 +NEG=1|assert:L2_START=1|q"
  "m1_nostall|+SEED=11 +VEC=$V/m1 +STALL=0|pass"
  "m2_nostall|+SEED=12 +VEC=$V/m2 +STALL=0|pass"
  "m1_stall|+SEED=13 +VEC=$V/m1 +STALL=1 +GAP=25 +PY=60 +OBLK=1|pass"
  "m2_stall_p00|-gDOT_PIPE=0 -gSH_PIPE=0 -gRS_PIPE=0 -gLUT_PIPE=1 +SEED=14 +VEC=$V/m2 +STALL=1 +GAP=20 +PY=50 +OBLK=1|pass"
  "hbhd_nostall_p44|-gDOT_PIPE=4 -gSH_PIPE=2 -gRS_PIPE=2 -gLUT_PIPE=3 +SEED=15 +VEC=$V/hb1,$V/hd1,$V/hb2,$V/hd2 +STALL=0|pass"
  "hbhd_stall|+SEED=16 +VEC=$V/hb1,$V/hd1,$V/hb2,$V/hd2 +STALL=1 +GAP=30 +PY=40|pass"
  "syn_nostall|+SEED=17 +SYN=900 +STALL=0|pass"
  "syn_stall_od4|-gOUT_DEPTH=4 +SEED=18 +SYN=900 +STALL=1 +GAP=20 +PY=50 +OBLK=1|pass"
  "syn_hs20_t64|-gHS_MAX=20 -gTMAX=64 +SEED=19 +SYN=600 +STALL=0|pass"
  "bad_klvl|-gVL=4|elab_fail:attn_core: KL=8 and VL=4 must be equal"
)
