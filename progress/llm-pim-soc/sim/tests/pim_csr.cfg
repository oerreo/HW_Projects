# pim_csr (rtl/l3/pim_csr.sv) alone against a register-file model written from docs/spec/pim.md
# (tb/pim_csr): random write / read strobes every cycle (CMD0..3 with legal and illegal fields,
# CMD_PUSH, CTRL start 0/1 op 0..15, ERR W1C, unused and unaligned addresses), random FIFO status
# and events. Every cycle: read data, start / busy / run_flush, push / push data. Coverage
# required: every ERR bit, each BAD_DESC reason alone, the 2^32 edge for LDW / WRGB / MACAB and the
# DEPTH edge accepted, START_BUSY (also with a bad op), CTRL in the done cycle, W1C vs set, FLUSH.
TOP=tb_pim_csr
RTL_FILES="pkg/llm_pkg.sv l0/umul_seq.sv l3/pim_csr.sv"
TB_FILES="common/tb_util_pkg.sv pim_csr/tb_pim_csr.sv"
DPI=0
RUNS=(
  "q_rnd|+SEED=1 +N_CYC=300000 +PDONE=5 +PEV=30|pass|q"
  "rnd_long|+SEED=2 +N_CYC=2000000 +PDONE=2 +PEV=10|pass"
  "nb8_d1k|-gNB=8 -gDEPTH=1024 -gNMAX=256 +SEED=3 +N_CYC=500000 +PDONE=10 +PEV=30|pass"
  "cd1|-gCMD_DEPTH=1 +SEED=4 +N_CYC=300000 +PDONE=20 +PEV=40|pass|q"
  "bad_nmax|-gNMAX=4096|elab_fail:pim_csr: NMAX=4096 must be 1..4095|q"
)
