# lut_lerp (rtl/l0/lut_lerp.sv, tables rtl/pkg/lut_pkg.sv) against the golden model through DPI-C
# (tb/lut_lerp).
# FUNC 0 EXP2N: k_exp2neg(u, 8, k_exp_lut(8)). Every table entry == k_exp_lut(8); every u in
# [0, 2^21) (I = 0..31, all indices and fractions); random u >= 2^21 (I >= 32 -> 0); valid gaps.
# FUNC 1 SIGM (S4-7): k_sigmoid(a, 8, k_sig_lut(8)). Every table entry == k_sig_lut(8); every a in
# [-2^20, 2^20] (negative a: 1 - s); index / fraction edges of both signs; random |a| > 2^20
# (saturation) and the int32 extremes.
# PIPE 1, 2, 3. Quick tier: 200,000 random inputs instead of the exhaustive sweep.
TOP=tb_lut_lerp
RTL_FILES="pkg/lut_pkg.sv l0/lut_lerp.sv"
TB_FILES="common/tb_util_pkg.sv dpi/kdpi_pkg.sv lut_lerp/tb_lut_lerp.sv"
DPI=1
RUNS=(
  "q_p2|-gPIPE=2 +SEED=1 +EXH=0 +N=100000|pass|q"
  "exh_p1|-gPIPE=1 +SEED=2 +EXH=1 +N=1000000 +GAP=5|pass"
  "exh_p2|-gPIPE=2 +SEED=3 +EXH=1 +N=1000000 +GAP=20|pass"
  "exh_p3|-gPIPE=3 +SEED=4 +EXH=1 +N=1000000 +GAP=0|pass"
  "q_sig_p2|-gFUNC=1 -gPIPE=2 +SEED=5 +EXH=0 +N=100000|pass|q"
  "sig_exh_p1|-gFUNC=1 -gPIPE=1 +SEED=6 +EXH=1 +N=1000000 +GAP=5|pass"
  "sig_exh_p2|-gFUNC=1 -gPIPE=2 +SEED=7 +EXH=1 +N=1000000 +GAP=20|pass"
  "sig_exh_p3|-gFUNC=1 -gPIPE=3 +SEED=8 +EXH=1 +N=1000000 +GAP=0|pass"
  "bad_pipe|-gPIPE=0|elab_fail:lut_lerp: PIPE=0 must be 1..3|q"
  "bad_func|-gFUNC=2|elab_fail:lut_lerp: FUNC=2 must be 0 (EXP2N) or 1 (SIGM)"
)
