# lut_lerp FUNC EXP2N (rtl/l0/lut_lerp.sv, table rtl/pkg/lut_pkg.sv) against k_exp2neg(u, 8,
# k_exp_lut(8)) through DPI-C (tb/lut_lerp). Every table entry == k_exp_lut(8); every u in
# [0, 2^21) (I = 0..31, all indices and fractions); random u >= 2^21 (I >= 32 -> 0); valid gaps.
# PIPE 1, 2, 3. Quick tier: 200,000 random u < 2^21 instead of the exhaustive sweep.
TOP=tb_lut_lerp
RTL_FILES="pkg/lut_pkg.sv l0/lut_lerp.sv"
TB_FILES="common/tb_util_pkg.sv dpi/kdpi_pkg.sv lut_lerp/tb_lut_lerp.sv"
DPI=1
RUNS=(
  "q_p2|-gPIPE=2 +SEED=1 +EXH=0 +N=100000|pass|q"
  "exh_p1|-gPIPE=1 +SEED=2 +EXH=1 +N=1000000 +GAP=5|pass"
  "exh_p2|-gPIPE=2 +SEED=3 +EXH=1 +N=1000000 +GAP=20|pass"
  "exh_p3|-gPIPE=3 +SEED=4 +EXH=1 +N=1000000 +GAP=0|pass"
  "bad_pipe|-gPIPE=0|elab_fail:lut_lerp: PIPE=0 must be 1..3|q"
  "bad_func|-gFUNC=1|elab_fail:lut_lerp: FUNC=1 not implemented"
)
