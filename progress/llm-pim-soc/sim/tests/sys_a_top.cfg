# sys_a_top (rtl/l4/sys_a_top.sv, build A of docs/spec/system.md 1.2: axil_xbar + gemv_acc_top P 1 +
# attn_top H_PAR 1 DDR KV HS_MAX 64 + vec_top) with the smoke testbench tb/sys_top/tb_sys_top.sv
# (BUILD 0): ID / CONFIG of all 16 slots (absent slots read 0, writes there ignored), one call per IP
# against the golden model (gemv_acc synthetic GEMV + argmax: kd_gemv1 / kd_argmax; attn: 15M
# K_ATTN2 records of position 0 (all layers) and position 1 layer 0, o and p; vec: ACTQ and ARGMAX),
# HP port assignment (bursts only on the expected ports during each call, HP2 tied off), one AXI
# memory model per HP port. VAR 1 = build A2 (GA_P 2: HP2 read = gemv_acc slice 1, even / odd rows
# only in the HP0 / HP2 memory), VAR 2 = XB_REG 0.
TOP=tb_sys_top
RTL_FILES="pkg/llm_pkg.sv pkg/lut_pkg.sv l0/rshr_sat.sv l0/dotp.sv l0/sync_fifo.sv l0/ram_sdp.sv l0/udiv_seq.sv l0/umul_seq.sv l0/lut_lerp.sv l0/argmax_red.sv l0/rsqrt_nr.sv l1/mac_row.sv l1/gemv_scale.sv l1/exp_unit.sv l1/attn_score.sv l1/attn_vacc.sv l1/actq_core.sv l1/rms_front.sv l1/swi_front.sv l1/axil_slave.sv l1/axi_rd_eng.sv l1/axi_wr_eng.sv l1/pim_gb.sv l1/pim_bank.sv l1/pim_ctrl.sv l2/gemv_core.sv l2/pim_core.sv l2/attn_core.sv l2/kv_store.sv l2/kv_rd.sv l2/vec_core.sv l3/gemv_acc_csr.sv l3/gemv_acc_top.sv l3/pim_csr.sv l3/pim_top.sv l3/attn_csr.sv l3/attn_top.sv l3/vec_csr.sv l3/vec_top.sv l4/axil_xbar.sv l4/sys_a_top.sv l4/sys_p_top.sv"
TB_FILES="common/tb_util_pkg.sv common/axi_mem_slave.sv common/axil_bfm.sv dpi/kdpi_pkg.sv common/attn_tb_pkg.sv common/vec_tb_pkg.sv sys_top/tb_sys_top.sv"
DPI=1
NEED="model/build/vec/m2/attn2.bin"
M2="+VEC_AT=../../model/build/vec/m2"
RUNS=(
  "q_a|-gBUILD=0 +SEED=1 +MAXD=1 $M2|pass|q"
  "q_a2|-gBUILD=0 -gVAR=1 +SEED=2 +MAXD=2 $M2|pass|q"
  "a_xb0|-gBUILD=0 -gVAR=2 +SEED=3 +MAXD=3 $M2|pass"
  "a_seed4|-gBUILD=0 +SEED=4 +MAXD=0 $M2 +NGRP=13|pass"
  "a_bad_gap|-gBUILD=0 -gGA_P=3|elab_fail:sys_a_top: GA_P=3 must be 1 or 2|q"
  "a_bad_hp2|-gBUILD=0 -gGA_P=2 -gAT_H_PAR=2|elab_fail:sys_a_top: GA_P=2 and AT_H_PAR=2 both need the HP2 read channel"
)
