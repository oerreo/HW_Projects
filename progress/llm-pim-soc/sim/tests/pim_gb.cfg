# pim_gb (rtl/l1/pim_gb.sv with l0/ram_sdp) alone (tb/pim_gb): random loads (n 1..NMAX with
# corners, garbage in the lanes beyond n, random beat gaps), every word read back in random order
# and compared with x padded with 0 (golden gbuf of model/src/bank.c bank_gemv); a smaller load
# after a larger one must hide the old words. busy / ready / done timing. NEG: load during a load.
TOP=tb_pim_gb
RTL_FILES="pkg/llm_pkg.sv l0/ram_sdp.sv l1/pim_gb.sv"
TB_FILES="common/tb_util_pkg.sv pim_gb/tb_pim_gb.sv"
DPI=0
RUNS=(
  "q_rnd|+SEED=1 +NLOAD=200 +GAP=20|pass|q"
  "nogap|+SEED=2 +NLOAD=200 +GAP=0|pass"
  "gap60|+SEED=3 +NLOAD=200 +GAP=60|pass"
  "nmax64|-gNMAX=64 +SEED=4 +NLOAD=400 +GAP=30|pass|q"
  "nmax48|-gNMAX=48 +SEED=5 +NLOAD=400 +GAP=30|pass"
  "neg_load|+SEED=6 +NEG=1|assert:PIM_GB_LOAD=1|q"
  "bad_nmax|-gNMAX=40|elab_fail:pim_gb: NMAX=40 must be a multiple of 16|q"
)
