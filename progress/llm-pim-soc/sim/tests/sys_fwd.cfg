# RTL system testbench forward runs (S5-4, gate G5, docs/spec/system.md 3.2, 3.3): tb/sys_top/tb_sys_fwd.sv,
# the same build as sys_smoke.cfg (unchanged system program of fpga/sys/sw on sys_a_top / sys_p_top through
# DPI-C, one shared DDR image behind all HP ports). Every run: the program's slot detection finds the build,
# every simulated position's token and logits hash == PC expected values (fpga/sw/expect/exp_m*.h), run K
# kernel compare 0, COH 0, fallback 0, IPERR 0, CYCLES of every gemv_acc / vec op == closed form, no AXI
# protocol message, all ports idle at the end (tb/sys_top/sys_tb.c, tb_sys_fwd.sv).
# Build P (BUILD 1, 260K): p_full init (LDW of all 36 matrices) + positions 0..3, mask ff, runs P and K;
#   p_warm positions 0..510 on the ARM, KVW of positions 0..510 (sx_kv_sync), position 511 (T 512) mask ff;
#   p_single every mask bit alone; p_masks other masks of system.md 4.1; p_opt DEFER_AT 0, PIM_BATCH 1,
#   WRGB_SKIP 0, COH_STRICT, G+C with PIM_BATCH.
# Build A (BUILD 0): a_m1 260K positions 0..3 (gemv_acc + DDR KV attention with hs 8 on HS_MAX 64);
#   a_m1_single every mask bit alone and FUSE_AM 0; a_m1_warm 260K position 511 after 0..510 on the ARM;
#   a_m2 15M positions 0..3 mask ff (FUSE_AM 1), run P; a_m2_k positions 0..1 as run K; a_m2_warm 15M position 255
#   after 0..254 on the ARM (DDR KV, no sync). Variants: a2_m1 build A2 (GA_P 2, slice 1 on HP2), pd_m1
#   build PD (attention KV_SRC 1 with H_PAR 2), p_xb0 / a_xb0 XB_REG 0 with AXI-Lite gaps.
# +CYCTRACE: CYCLES of every op read by a driver (compared with the host models by tb/sys_top/cyc_cmp.py).
# Fault injection (hal_dpi.c +TB_IPFAULT): the n-th start of one IP sees SLVERR on all reads / writes of its
#   HP ports, or no responses at all (hang -> driver timeout, the IP is disabled, its later calls run on the
#   ARM = fallback): exactly that IPERR, token / hash / K compare / COH still 0, program RESULT FAIL.
# 15M runs need data/third_party/models/stories15M.bin and tokenizer.bin (see data/README.md).
TOP=tb_sys_fwd
RTL_FILES="pkg/llm_pkg.sv pkg/lut_pkg.sv l0/rshr_sat.sv l0/dotp.sv l0/sync_fifo.sv l0/ram_sdp.sv l0/udiv_seq.sv l0/umul_seq.sv l0/lut_lerp.sv l0/argmax_red.sv l0/rsqrt_nr.sv l1/mac_row.sv l1/gemv_scale.sv l1/exp_unit.sv l1/attn_score.sv l1/attn_vacc.sv l1/actq_core.sv l1/rms_front.sv l1/swi_front.sv l1/axil_slave.sv l1/axi_rd_eng.sv l1/axi_wr_eng.sv l1/pim_gb.sv l1/pim_bank.sv l1/pim_ctrl.sv l2/gemv_core.sv l2/pim_core.sv l2/attn_core.sv l2/kv_store.sv l2/kv_rd.sv l2/vec_core.sv l3/gemv_acc_csr.sv l3/gemv_acc_top.sv l3/pim_csr.sv l3/pim_top.sv l3/attn_csr.sv l3/attn_top.sv l3/vec_csr.sv l3/vec_top.sv l4/axil_xbar.sv l4/sys_a_top.sv l4/sys_p_top.sv"
TB_FILES="common/tb_util_pkg.sv common/axi_mem_slave.sv common/axil_bfm.sv sys_top/tb_sys_fwd.sv"
DPI=1
DPI_C="model/src/core.c model/src/tok.c model/src/fwd_f.c model/src/fwd_q.c model/src/hq.c model/src/fwd_h.c model/src/kern.c model/src/tabs.c model/src/bank.c fpga/sw/src/out.c fpga/sw/src/lmhash.c fpga/sw/src/exp.c fpga/sw/src/prof.c fpga/sw/gen/m1_data.c fpga/sys/sw/sbench.c fpga/sys/sw/sx_exec.c fpga/sys/sw/sysmem.c fpga/sys/sw/drv_com.c fpga/sys/sw/drv_ga.c fpga/sys/sw/drv_pi.c fpga/sys/sw/drv_at.c fpga/sys/sw/drv_ve.c fpga/sys/test/hal_cache.c tb/sys_top/sys_main_dpi.c tb/sys_top/hal_dpi.c tb/sys_top/plat_dpi.c tb/sys_top/sys_tb.c"
DPI_INC="model/src fpga/sw/src fpga/sw/expect fpga/sys/sw fpga/sys/test tb/sys_top"
DPI_DEFS="-DHAL_HOST -DSX_FAULT_INJ=1"
NEED="fpga/sw/gen/m1_data.c data/third_party/models/stories15M.bin data/third_party/models/tokenizer.bin"
M1="+SX_MODELS=1"
M2="+SX_MODELS=2 +DDR_CK=../../data/third_party/models/stories15M.bin +DDR_TK=../../data/third_party/models/tokenizer.bin"
RUNS=(
  "p_full|-gBUILD=1 +SEED=21 +EXP_BUILD=P $M1 +SX_STEPS=4 +SX_LIST=ff +SX_RUNS=PK +EXP_CHECKS=2 +CYCTRACE=c_p_full.txt|pass|q"
  "p_warm|-gBUILD=1 +SEED=22 +EXP_BUILD=P $M1 +SX_STEPS=512 +SX_LIST=ff +SX_RUNS=W +EXP_CHECKS=1 +CYCTRACE=c_p_warm.txt|pass"
  "p_single|-gBUILD=1 +SEED=23 +EXP_BUILD=P $M1 +SX_STEPS=2 +SX_LIST=1,2,4,8,10,20,40,80 +SX_RUNS=PK +EXP_CHECKS=16 +CYCTRACE=c_p_single.txt|pass"
  "p_masks|-gBUILD=1 +SEED=24 +EXP_BUILD=P $M1 +SX_STEPS=2 +SX_LIST=0,3,82,7,f8,df +SX_RUNS=PK +EXP_CHECKS=12 +CYCTRACE=c_p_masks.txt|pass"
  "p_opt|-gBUILD=1 +SEED=25 +EXP_BUILD=P $M1 +SX_STEPS=2 +SX_LIST=ff:0c,ff:0f,ff:09,ff:1d,3:0f +SX_RUNS=PK +EXP_CHECKS=10 +CYCTRACE=c_p_opt.txt|pass"
  "p_xb0|-gBUILD=1 -gVAR=2 +SEED=26 +MAXD=2 +EXP_BUILD=P $M1 +SX_STEPS=2 +SX_LIST=ff +SX_RUNS=K +EXP_CHECKS=1 +CYCTRACE=c_p_xb0.txt|pass"
  "a_m1|-gBUILD=0 +SEED=31 +EXP_BUILD=A $M1 +SX_STEPS=4 +SX_LIST=ff,3 +SX_RUNS=PK +EXP_CHECKS=4 +CYCTRACE=c_a_m1.txt|pass|q"
  "a_m1_single|-gBUILD=0 +SEED=32 +EXP_BUILD=A $M1 +SX_STEPS=2 +SX_LIST=1,2,82,4,8,10,20,40,80,ff:05 +SX_RUNS=PK +EXP_CHECKS=20 +CYCTRACE=c_a_m1_single.txt|pass"
  "a_m1_warm|-gBUILD=0 +SEED=33 +EXP_BUILD=A $M1 +SX_STEPS=512 +SX_LIST=ff +SX_RUNS=W +EXP_CHECKS=1 +CYCTRACE=c_a_m1_warm.txt|pass"
  "a_xb0|-gBUILD=0 -gVAR=2 +SEED=34 +MAXD=2 +EXP_BUILD=A $M1 +SX_STEPS=2 +SX_LIST=ff +SX_RUNS=K +EXP_CHECKS=1 +CYCTRACE=c_a_xb0.txt|pass"
  "a_m2|-gBUILD=0 +SEED=35 +EXP_BUILD=A $M2 +SX_STEPS=4 +SX_LIST=ff +SX_RUNS=P +EXP_CHECKS=1 +CYCTRACE=c_a_m2.txt|pass"
  "a_m2_k|-gBUILD=0 +SEED=36 +EXP_BUILD=A $M2 +SX_STEPS=2 +SX_LIST=ff +SX_RUNS=K +EXP_CHECKS=1 +CYCTRACE=c_a_m2_k.txt|pass"
  "a_m2_warm|-gBUILD=0 +SEED=37 +EXP_BUILD=A $M2 +SX_STEPS=256 +SX_LIST=ff +SX_RUNS=W +EXP_CHECKS=1 +CYCTRACE=c_a_m2_warm.txt|pass"
  "a2_m1|-gBUILD=0 -gVAR=1 +SEED=38 +EXP_BUILD=A2 $M1 +SX_STEPS=2 +SX_LIST=ff,3 +SX_RUNS=PK +EXP_CHECKS=4 +CYCTRACE=c_a2_m1.txt|pass"
  "pd_m1|-gBUILD=1 -gVAR=1 +SEED=27 +EXP_BUILD=PD $M1 +SX_STEPS=2 +SX_LIST=ff,4 +SX_RUNS=PK +EXP_CHECKS=4 +CYCTRACE=c_pd_m1.txt|pass"
  "a_err_rd|-gBUILD=0 +SEED=41 +EXP_BUILD=A $M1 +SX_STEPS=2 +SX_LIST=ff +SX_RUNS=P +EXP_CHECKS=1 +TB_IPFAULT=rdresp +TB_IPFAULT_SLOT=0 +TB_IPFAULT_OP=7 +EXP_IPERR=1 +EXP_IPERR_IP=ga +EXP_IPERR_KIND=err +CYCTRACE=c_a_err_rd.txt|pass|q"
  "a_err_wr|-gBUILD=0 +SEED=42 +EXP_BUILD=A $M1 +SX_STEPS=2 +SX_LIST=ff +SX_RUNS=P +EXP_CHECKS=1 +TB_IPFAULT=wrresp +TB_IPFAULT_SLOT=3 +TB_IPFAULT_OP=9 +EXP_IPERR=1 +EXP_IPERR_IP=ve +EXP_IPERR_KIND=err +CYCTRACE=c_a_err_wr.txt|pass"
  "a_err_hang|-gBUILD=0 +SEED=43 +EXP_BUILD=A $M1 +SX_STEPS=2 +SX_LIST=ff +SX_RUNS=P +EXP_CHECKS=1 +TB_IPFAULT=hang +TB_IPFAULT_SLOT=2 +TB_IPFAULT_OP=3 +EXP_IPERR=1 +EXP_IPERR_IP=at +EXP_IPERR_KIND=timeout +EXP_FB=1000 +CYCTRACE=c_a_err_hang.txt|pass"
  "p_err_rd|-gBUILD=1 +SEED=44 +EXP_BUILD=P $M1 +SX_STEPS=2 +SX_LIST=ff +SX_RUNS=P +EXP_CHECKS=1 +TB_IPFAULT=rdresp +TB_IPFAULT_SLOT=1 +TB_IPFAULT_OP=3 +EXP_IPERR=1 +EXP_IPERR_IP=pi +EXP_IPERR_KIND=err +CYCTRACE=c_p_err_rd.txt|pass"
  "p_err_wr|-gBUILD=1 +SEED=45 +EXP_BUILD=P $M1 +SX_STEPS=2 +SX_LIST=ff +SX_RUNS=P +EXP_CHECKS=1 +TB_IPFAULT=wrresp +TB_IPFAULT_SLOT=2 +TB_IPFAULT_OP=4 +EXP_IPERR=1 +EXP_IPERR_IP=at +EXP_IPERR_KIND=err +CYCTRACE=c_p_err_wr.txt|pass"
  "p_err_hang|-gBUILD=1 +SEED=46 +EXP_BUILD=P $M1 +SX_STEPS=2 +SX_LIST=ff +SX_RUNS=P +EXP_CHECKS=1 +TB_IPFAULT=hang +TB_IPFAULT_SLOT=3 +TB_IPFAULT_OP=10 +EXP_IPERR=1 +EXP_IPERR_IP=ve +EXP_IPERR_KIND=timeout +EXP_FB=1000 +CYCTRACE=c_p_err_hang.txt|pass"
)
