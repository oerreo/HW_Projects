# RTL system testbench forward runs (S5-4, gate G5, docs/spec/system.md 3.2, 3.3): tb/sys_top/tb_sys_fwd.sv,
# the same build as sys_smoke.cfg (unchanged system program of fpga/sys/sw on sys_a_top / sys_p_top through
# DPI-C, one shared DDR image behind all HP ports). Every run: the program's slot detection finds the build,
# every simulated position's token and logits hash == PC expected values (fpga/sw/expect/exp_m*.h), run K
# kernel compare 0, COH 0, fallback 0, IPERR 0, CYCLES of every gemv_acc / vec op == closed form, no AXI
# protocol message, all ports idle at the end (tb/sys_top/sys_tb.c, tb_sys_fwd.sv).
# Build P (BUILD 1, 260K): p_full init (LDW of all 36 matrices) + positions 0..3, mask ff, runs P and K;
#   p_warm positions 0..510 on the ARM, KVW of positions 0..510 (sx_kv_sync), position 511 (T 512) mask ff;
#   p_single every mask bit alone; p_masks other masks of system.md 4.1; p_opt DEFER_AT 0, PIM_BATCH 1,
#   WRGB_SKIP 0, COH_STRICT, G+C with PIM_BATCH.
# Build A (BUILD 0): a_m1 260K positions 0..3 (gemv_acc + DDR KV attention with hs 8 on HS_MAX 64);
#   a_m1_single every mask bit alone and FUSE_AM 0; a_m1_warm 260K position 511 after 0..510 on the ARM;
#   a_m2 15M positions 0..3 mask ff (FUSE_AM 1), run P; a_m2_k positions 0..1 as run K; a_m2_warm 15M position 255
#   after 0..254 on the ARM (DDR KV, no sync). Variants: a2_m1 build A2 (GA_P 2, slice 1 on HP2), pd_m1
#   build PD (attention KV_SRC 1 with H_PAR 2), p_xb0 / a_xb0 XB_REG 0 with AXI-Lite gaps.
# +CYCTRACE: CYCLES of every op read by a driver (compared with the host models by tb/sys_top/cyc_cmp.py).
# +VTRACE: event trace for the system viewer (docs/viewer, hal_dpi.c header; kernel names through
#   tb/sys_top/hal_cache_dpi.c), only p_full, a_m1, a_m2, p_stall.
# Fault injection (hal_dpi.c +TB_IPFAULT): the n-th start of one IP sees SLVERR on all reads / writes of its
#   HP ports, or no responses at all (hang -> driver timeout, the IP is disabled, its later calls run on the
#   ARM = fallback): exactly that IPERR, token / hash / K compare / COH still 0, program RESULT FAIL.
# Memory stall runs (+PROF, tb_sys_fwd.sv header): random AR/AW/W/R/B stall and R/B latency on all HP
#   memory models; same pass criteria except that the CYCLES closed forms are lower bounds (CYC_LOW 0),
#   every RD_STALL / WR_STALL <= its CYCLES (ST_BAD 0), R stalls on HP3 imply a vec RD_STALL sum > 0 (VE_RDST);
#   evidence: AXI_MEM_STALL and SYSTB STALL lines.
#   p_stall build P 260K 0..1 ff P+K PROF 2 (50 %), a_stall build A 260K 0..1 ff P+K PROF 3 (per port),
#   a_m2_stall build A 15M position 0 ff P PROF 1 (20 %).
# S5-4 follow-up (2026-11-25):
#   pv_m1 build PV (build P with vec N_MAX 256, system.md O7, VAR 3): 260K 0..1 ff P+K; fallback 0 means every
#     vec op of 260K passed the executor guard n <= N_MAX (CONFIG of vec read by the program = 256).
#   pn_fb build P with vec N_MAX 128 (-gVE_N_MAX=128, not a planned build): the executor guard sends every
#     SWIGLU (n 172 > 128) to the ARM while vec is on (exactly 10 fallback calls per run of 2 positions);
#     token / hash / K compare / COH 0 (cache rule of the guard fallback, sx_exec.c).
#   *_st: fault injection under memory stall (PROF 1..3), the same faults / pass criteria as the *_err_* runs.
#   a2_stall, pd_stall, p_xb0_stall: the variant builds under memory stall.
#   *_sv<n>: "-sv_seed <n>" (vsim option in the run arguments) changes the random stall / latency pattern of
#     the HP memory models (their threads are not reseeded by +SEED); same +SEED and checks as the base run.
# 15M runs need data/third_party/models/stories15M.bin and tokenizer.bin (see data/README.md).
TOP=tb_sys_fwd
