# pim_core (rtl/l2/pim_core.sv with l1/pim_ctrl, pim_gb, pim_bank, mac_row, gemv_scale, l0/dotp,
# rshr_sat, ram_sdp, sync_fifo) at its stream boundary (tb/pim_core): the TB is the read engine
# (random gaps), the write engine (random accept delays, random y_ready, YBLK long blocks).
# Records: LDW of the 36 260K matrices from model/build/vec/m1/rrec.bin -> every bank RAM ==
# model/build/vec/pim/bank<b>.hex (bimg_pack), words above the image unchanged; then all 432
# K_GEMV records (12 positions x 36) as MACABs, y == recorded y. LAYER=1: arch.md 3.3 order (WRGB
# once per x group, layer 4 WRGB + 7 MACAB, then cls; the TB checks the group's x are the same),
# LAYER=0: WRGB + MACAB per record. Counts per command == bank_stat_t of the same call (DPI
# kd_rec_bank / kd_bank_syn: bank_pack BANK_ROW + bank_gemv). STALL=0: the last y of every MACAB
# in the cycle of the pim.md formula. SYN: synthetic LDW / WRGB / MACAB groups (n 1..1024, rows
# 1..300 incl. non-multiples of NB, bases up to the top of the bank, garbage in headers / padding).
TOP=tb_pim_core
RTL_FILES="pkg/llm_pkg.sv l0/rshr_sat.sv l0/dotp.sv l0/sync_fifo.sv l0/ram_sdp.sv l0/umul_seq.sv l1/mac_row.sv l1/gemv_scale.sv l1/pim_gb.sv l1/pim_bank.sv l1/pim_ctrl.sv l2/pim_core.sv"
TB_FILES="common/tb_util_pkg.sv dpi/kdpi_pkg.sv pim_core/tb_pim_core.sv"
DPI=1
NEED="model/build/vec/m1/gemv.bin model/build/vec/m1/rrec.bin model/build/vec/pim/bank0.hex"
M1="+VEC=../../model/build/vec/m1"
RUNS=(
  "q_m1_nostall|+SEED=1 $M1 +STALL=0|pass|q"
  "q_m1_stall|+SEED=2 $M1 +MAXPOS=2 +STALL=1 +YBLK=1|pass|q"
  "q_m1_perrec|+SEED=3 $M1 +MAXPOS=2 +LAYER=0 +STALL=1|pass|q"
  "q_syn_nostall|+SEED=4 +SYN=120 +STALL=0|pass|q"
  "q_syn_stall|+SEED=5 +SYN=120 +STALL=1 +YBLK=1|pass|q"
  "m1_stall|+SEED=6 $M1 +STALL=1 +YBLK=1|pass"
  "m1_perrec_nostall|+SEED=7 $M1 +LAYER=0 +STALL=0|pass"
  "m1_p00|-gDOT_PIPE=0 -gSCALE_PIPE=0 +SEED=8 $M1 +STALL=0|pass"
  "m1_p44|-gDOT_PIPE=4 -gSCALE_PIPE=4 +SEED=9 $M1 +STALL=1 +YBLK=1|pass"
  "syn_long|+SEED=10 +SYN=600 +STALL=1 +YBLK=1 +GAP=40|pass"
  "syn_y8|-gY_DEPTH=8 +SEED=11 +SYN=300 +STALL=1 +YBLK=1|pass"
  "syn_p44_nostall|-gDOT_PIPE=4 -gSCALE_PIPE=4 +SEED=12 +SYN=300 +STALL=0|pass"
)
