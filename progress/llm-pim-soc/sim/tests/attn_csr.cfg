# attn_csr (rtl/l3/attn_csr.sv with umul_seq, udiv_seq) alone against a register-file model written
# from docs/spec/attn.md 3 and 4 (tb/attn_csr): directed calls (a legal template; every BAD_DESC
# reason alone with its first illegal and last legal value; every byte range ending exactly at 2^32
# and 8 bytes beyond, also with the largest products of the build; BAD_DESC with MISALIGN; BAD_OP;
# START_BUSY in every check cycle, the verdict cycle and the op, also with a bad op; CTRL in the
# done cycle; descriptor writes during the check), then random write / read strobes every cycle
# with random events. Every cycle: read data, start_o (verdict cycle s + CHK), busy_o, op_kvw_o,
# latched descriptor, derived products (SEQ hs, T hs, KVH0 SEQ + POS).
# Builds: BRAM KV (KV_SRC 0, HS_MAX 8 = KL, NKV 4), BRAM with HS_MAX 16 (hs > KL alone), NKV 1 / 7,
# DDR KV (KV_SRC 1, HS_MAX 64 and 255, TMAX 512 / 100).
TOP=tb_attn_csr
RTL_FILES="pkg/llm_pkg.sv l0/udiv_seq.sv l0/umul_seq.sv l3/attn_csr.sv"
TB_FILES="common/tb_util_pkg.sv attn_csr/tb_attn_csr.sv"
DPI=0
RUNS=(
  "q_bram|+SEED=1 +N_CYC=300000 +PDONE=5 +PEV=30|pass|q"
  "q_ddr|-gKV_SRC=1 -gHS_MAX=64 +SEED=2 +N_CYC=300000 +PDONE=5 +PEV=30|pass|q"
  "bram_long|+SEED=11 +N_CYC=2000000 +PDONE=2 +PEV=10|pass"
  "bram_hs16|-gHS_MAX=16 +SEED=12 +N_CYC=500000 +PDONE=10 +PEV=30|pass"
  "bram_nkv1|-gNKV=1 -gNL=1 +SEED=13 +N_CYC=300000 +PDONE=10 +PEV=30|pass"
  "bram_nkv7|-gNKV=7 -gKW=16 -gVW=16 -gTMAX=100 +SEED=14 +N_CYC=300000 +PDONE=10 +PEV=30|pass"
  "ddr_long|-gKV_SRC=1 -gHS_MAX=64 +SEED=15 +N_CYC=2000000 +PDONE=2 +PEV=10|pass"
  "ddr_hs255|-gKV_SRC=1 -gHS_MAX=255 -gTMAX=100 +SEED=16 +N_CYC=500000 +PDONE=10 +PEV=30|pass"
  "ddr_hs8|-gKV_SRC=1 -gHS_MAX=8 -gTMAX=65535 +SEED=17 +N_CYC=300000 +PDONE=10 +PEV=30|pass"
  "bad_hsmax|-gHS_MAX=4|elab_fail:attn_csr: HS_MAX=4 must be 8..255|q"
)
