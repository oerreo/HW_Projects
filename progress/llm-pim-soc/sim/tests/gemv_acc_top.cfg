# gemv_acc_top (rtl/l3/gemv_acc_top.sv with l3/gemv_acc_csr, l1/axil_slave, l1/axi_rd_eng,
# l1/axi_wr_eng, l2/gemv_core (+ mac_row, gemv_scale, dotp, rshr_sat, ram_sdp, sync_fifo),
# l0/argmax_red) over AXI4-Lite (tb/common/axil_bfm.sv), AXI masters on
# tb/common/axi_mem_slave.sv (tb/gemv_acc_top). Every call: y memory vs the K_GEMV record or
# kd_gemv1 (golden), guards, AW/AR address ranges, R beats per port, ARGMAX_IDX/VAL vs the
# K_ARGMAX record or kd_argmax, CYCLES = e - s from the bus, RD_STALL / WR_STALL vs TB counts,
# and a per-cycle CSR reference model (every read word, start and done cycles).
# Records: 260K all 432 K_GEMV records (12 positions x 36 matrices incl. the 512 x 64
# classifier), 15M all 258 (6 x 43 incl. the 32000 x 288 classifier); Y0=1 repeats every
# classifier call with y_en = 0. Quick tier: 260K all records (P = 1, 2) and the first 15M
# position (43 records incl. one classifier call).
# CYC=1 (PROF=0: no memory stall, latency 1): CYCLES must equal the formula of
# docs/spec/gemv_acc.md for every call. PROF 1/2 memory stalls and latencies, MAXD AXI-Lite
# gaps, B2B descriptor written while the previous call runs, ERR every ERR cause, COLL CTRL
# write in the done cycle and W1C against a set (PROF=0, MAXD=0 needed), WBLK / RBLK long
# write / read blocks (write buffer full, gemv_core credit and read space limits must be
# reached).
TOP=tb_gemv_acc_top
RTL_FILES="pkg/llm_pkg.sv l0/rshr_sat.sv l0/dotp.sv l0/sync_fifo.sv l0/ram_sdp.sv l0/argmax_red.sv l1/mac_row.sv l1/gemv_scale.sv l1/axil_slave.sv l1/axi_rd_eng.sv l1/axi_wr_eng.sv l2/gemv_core.sv l3/gemv_acc_csr.sv l3/gemv_acc_top.sv"
TB_FILES="common/tb_util_pkg.sv common/axi_mem_slave.sv common/axil_bfm.sv dpi/kdpi_pkg.sv gemv_acc_top/tb_gemv_acc_top.sv"
DPI=1
NEED="model/build/vec/m1/gemv.bin model/build/vec/m2/gemv.bin model/build/vec/m1/rrec.bin model/build/vec/m2/rrec.bin model/build/vec/m1/argmax.bin model/build/vec/m2/argmax.bin"
M1="+VEC=../../model/build/vec/m1"
M2="+VEC=../../model/build/vec/m2"
RUNS=(
  "q_p1_m1|+SEED=1 +PROF=1 +MAXD=2 $M1 +CSR=1|pass|q"
  "q_p2_m1|-gP=2 +SEED=2 +PROF=1 +MAXD=2 $M1 +CSR=1|pass|q"
  "q_p1_m2tok|+SEED=3 +PROF=0 +MAXD=0 $M2 +MAXREC=43 +CYC=1|pass|q"
  "q_p1_cyc|+SEED=4 +PROF=0 +MAXD=0 +SYN=300 +CYC=1 +B2B=1|pass|q"
  "q_p2_cyc|-gP=2 +SEED=5 +PROF=0 +MAXD=0 +SYN=300 +CYC=1 +B2B=1|pass|q"
  "q_p1_err|+SEED=6 +PROF=0 +MAXD=0 +ERR=1 +CSR=1|pass|q"
  "q_p2_err|-gP=2 +SEED=7 +PROF=0 +MAXD=0 +ERR=1|pass|q"
  "q_p1_coll|+SEED=21 +PROF=0 +MAXD=0 +COLL=1|pass|q"
  "q_p2_coll|-gP=2 +SEED=22 +PROF=0 +MAXD=0 +COLL=1|pass|q"
  "q_p1_blk|+SEED=8 +PROF=1 +MAXD=1 +SYN=150 +WBLK=1 +RBLK=1|pass|q"
  "q_p2_blk|-gP=2 +SEED=9 +PROF=1 +MAXD=1 +SYN=150 +WBLK=1 +RBLK=1|pass|q"
  "p1_m1_cyc|+SEED=10 +PROF=0 +MAXD=0 $M1 +CYC=1|pass"
  "p2_m1_cyc|-gP=2 +SEED=11 +PROF=0 +MAXD=0 $M1 +CYC=1|pass"
  "p1_m2|+SEED=12 +PROF=0 +MAXD=0 $M2 +CYC=1|pass"
  "p2_m2|-gP=2 +SEED=13 +PROF=1 +MAXD=2 $M2|pass"
  "p1_syn_heavy|+SEED=14 +PROF=2 +MAXD=4 +SYN=300 +ERR=1 +B2B=1|pass"
  "p2_syn_heavy|-gP=2 +SEED=15 +PROF=2 +MAXD=4 +SYN=300 +ERR=1 +B2B=1|pass"
  "p1_blk_long|+SEED=16 +PROF=2 +MAXD=2 +SYN=400 +WBLK=1 +RBLK=1 +B2B=1|pass"
  "p2_blk_long|-gP=2 +SEED=17 +PROF=2 +MAXD=2 +SYN=400 +WBLK=1 +RBLK=1 +B2B=1|pass"
  "p1_pipe00|-gDOT_PIPE=0 -gSCALE_PIPE=0 -gY_DEPTH=4 +SEED=18 +PROF=1 +MAXD=1 +SYN=300 +WBLK=1|pass"
  "p2_pipe44|-gP=2 -gDOT_PIPE=4 -gSCALE_PIPE=4 +SEED=19 +PROF=1 +MAXD=1 +SYN=300 +WBLK=1 +ERR=1|pass"
  "p1_b8o2|-gMAX_BURST=8 -gOUTS=2 +SEED=20 +PROF=1 +MAXD=1 +SYN=300 +WBLK=1 +ERR=1|pass"
  "bad_p3|-gP=3|elab_fail:gemv_acc_top: P=3 must be 1 or 2|q"
)
