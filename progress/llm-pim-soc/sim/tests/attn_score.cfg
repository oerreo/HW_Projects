# attn_score (rtl/l1/attn_score.sv with l0/dotp, l0/rshr_sat) against the k_attn2_st stage trace
# (tb/attn_score, tb/common/attn_tb_pkg.sv): s[t] (+ vm / ve passed along), mx, emin, mmax, have,
# exact latency. Every attention record of 260K / 15M K12V8 (m1, m2: T 1..512, hs 8 and 48),
# HB (K8V8) and HD (K16V16) dumps, and synthetic calls (gen_syn modes: mixed, equal scores,
# saturation, all vs.m = 0, extreme exponents, T and hs at the limit; hs not a multiple of KL).
# K beats with random gaps; ignored lanes and scale inputs of non-last beats are random.
TOP=tb_attn_score
RTL_FILES="pkg/llm_pkg.sv l0/rshr_sat.sv l0/dotp.sv l1/attn_score.sv"
TB_FILES="common/tb_util_pkg.sv dpi/kdpi_pkg.sv common/attn_tb_pkg.sv attn_score/tb_attn_score.sv"
DPI=1
V=../../model/build/vec
NEED="model/build/vec/m1/attn2.bin model/build/vec/m2/attn2.bin model/build/vec/hb1/attn.bin model/build/vec/hd1/attn.bin model/build/vec/hb2/attn.bin model/build/vec/hd2/attn.bin"
RUNS=(
  "q_m1m2|+SEED=1 +VEC=$V/m1,$V/m2 +MAXREC=80 +SYN=60 +GAP=20|pass|q"
  "q_hbhd_p0|-gDOT_PIPE=0 -gSH_PIPE=0 +SEED=2 +VEC=$V/hb1,$V/hd2 +MAXREC=40 +SYN=30 +GAP=10|pass|q"
  "m1|+SEED=3 +VEC=$V/m1 +GAP=0|pass"
  "m2|+SEED=4 +VEC=$V/m2 +GAP=30|pass"
  "hbhd|-gDOT_PIPE=4 -gSH_PIPE=2 +SEED=5 +VEC=$V/hb1,$V/hd1,$V/hb2,$V/hd2 +GAP=15|pass"
  "syn|+SEED=6 +SYN=1200 +GAP=25|pass"
  "syn_kl4_hs40|-gKL=4 -gHS_MAX=40 -gDOT_PIPE=1 +SEED=7 +SYN=600 +GAP=10|pass"
)
