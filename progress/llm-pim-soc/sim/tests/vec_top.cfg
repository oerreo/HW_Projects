# vec_top (rtl/l3/vec_top.sv: axil_slave, vec_csr, axi_rd_eng, axi_wr_eng, vec_core, sequencers,
# packer) over AXI4-Lite with AXI memory models (tb/vec_top): every K_RMSNORM / K_SWIGLU / K_ACTQ /
# K_ARGMAX record of a model in the forward order of its manifest (token CYCLES sums per op),
# synthetic calls of every op; q, scale, argmax (memory and registers), guards, ERR, every-cycle CSR
# reference model with an independent descriptor check, CYCLES formula (no stalls), error paths and
# recovery, random register traffic, memory stalls, long write blocks (write buffer full, packer
# held, q FIFO full required).
TOP=tb_vec_top
RTL_FILES="pkg/llm_pkg.sv pkg/lut_pkg.sv l0/rshr_sat.sv l0/udiv_seq.sv l0/ram_sdp.sv l0/sync_fifo.sv l0/rsqrt_nr.sv l0/lut_lerp.sv l0/argmax_red.sv l1/actq_core.sv l1/rms_front.sv l1/swi_front.sv l1/axil_slave.sv l1/axi_rd_eng.sv l1/axi_wr_eng.sv l2/vec_core.sv l3/vec_csr.sv l3/vec_top.sv"
TB_FILES="common/tb_util_pkg.sv dpi/kdpi_pkg.sv common/vec_tb_pkg.sv common/axil_bfm.sv common/axi_mem_slave.sv vec_top/tb_vec_top.sv"
DPI=1
NEED="model/build/vec/m1/manifest.txt model/build/vec/m2/manifest.txt"
RUNS=(
  "q_m1|+SEED=1 +VEC=../../model/build/vec/m1 +FWD=1 +MAXPOS=2 +NSYN=40 +CYC=1|pass|q"
  "q_m2|+SEED=2 +VEC=../../model/build/vec/m2 +FWD=1 +MAXPOS=1 +CYC=1|pass|q"
  "q_err|+SEED=3 +ERR=1 +NSYN=30 +RND=1 +MAXD=2|pass|q"
  "q_wblk|+SEED=4 +NSYN=60 +WBLK=1 +MSTALL=1|pass|q"
  "m1_fwd|+SEED=5 +VEC=../../model/build/vec/m1 +FWD=1 +CYC=1|pass"
  "m2_fwd|+SEED=6 +VEC=../../model/build/vec/m2 +FWD=1 +CYC=1|pass"
  "syn_cyc|+SEED=7 +NSYN=1500 +AMAXN=65536 +CYC=1|pass"
  "m1_stall|+SEED=8 +VEC=../../model/build/vec/m1 +FWD=1 +MSTALL=1 +RND=1 +MAXD=3|pass"
  "m2_wblk|+SEED=9 +VEC=../../model/build/vec/m2 +FWD=1 +MAXPOS=2 +NSYN=200 +WBLK=1 +MSTALL=1|pass"
  "err_stall|+SEED=10 +ERR=1 +NSYN=300 +RND=1 +MAXD=3 +MSTALL=1|pass"
  "b8_o2_qd5|-gMAX_BURST=8 -gOUTS=2 -gQ_DEPTH=5 +SEED=11 +NSYN=600 +WBLK=1 +MSTALL=1|pass"
  "nmax64_idx8|-gN_MAX=64 -gIDX_W=8 +SEED=12 +NSYN=1000 +AMAXN=256 +ERR=1 +CYC=1|pass"
)
