# rsqrt_nr (rtl/l0/rsqrt_nr.sv, seed table rtl/pkg/lut_pkg.sv RSQ_TAB) against k_rsqrt(u, &re)
# through DPI-C (tb/rsqrt_nr): every seed table entry == k_rsq_lut; edges (0, 1, 2, 3, max, 2^k,
# 2^k - 1 for every bit length); every seed index edge at every even normalization shift; +NPER
# random inputs of every bit length (the make test pattern); +N random inputs of random bit length.
# Every op: rm and re, busy_o window, done_o exactly 15 cycles after the start, result held until
# the next start (also a start in the done cycle). NEG: starts while busy are ignored (RSQ_START).
# U_W 42 (rmsnorm u < 2^42 for N_MAX 1024), 20 (only left normalization) and 62 (widest).
TOP=tb_rsqrt_nr
RTL_FILES="pkg/llm_pkg.sv pkg/lut_pkg.sv l0/rsqrt_nr.sv"
TB_FILES="common/tb_util_pkg.sv dpi/kdpi_pkg.sv rsqrt_nr/tb_rsqrt_nr.sv"
DPI=1
RUNS=(
  "q_def|+SEED=1 +N=20000 +NPER=100|pass|q"
  "full|+SEED=2 +N=1000000 +NPER=4000|pass"
  "uw20|-gU_W=20 +SEED=3 +N=200000 +NPER=4000|pass"
  "uw62|-gU_W=62 +SEED=4 +N=300000 +NPER=2000|pass"
  "q_neg|+SEED=5 +N=3000 +NPER=10 +NEG=1|assert:RSQ_START=3|q"
  "bad_uw|-gU_W=63|elab_fail:rsqrt_nr: U_W=63 must be 1..62|q"
)
