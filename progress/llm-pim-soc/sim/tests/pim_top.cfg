# pim_top (rtl/l3/pim_top.sv with l3/pim_csr, l2/pim_core (+ pim_ctrl, pim_gb, pim_bank, mac_row,
# gemv_scale, dotp, rshr_sat, ram_sdp, sync_fifo), l1/axil_slave, axi_rd_eng, axi_wr_eng) over
# AXI4-Lite (tb/common/axil_bfm.sv), AXI master on tb/common/axi_mem_slave.sv (tb/pim_top).
# Records: LDW run of the 36 260K matrices (FIFO filled, the rest pushed while running) -> banks ==
# bimg_pack image (bank<b>.hex), words above unchanged; then all 432 K_GEMV records: MODE 0 one run
# per layer (arch.md 3.3: 4 WRGB + 7 MACAB) + cls, MODE 1 one run per token (57 commands, FIFO
# refilled while running), MODE 2 WRGB + MACAB per record. y + guards, counters == bank_stat_t sums
# (DPI), per-cycle CSR model (reads, start, push, FIFO level, popped words, run end), CYCLES = e - s,
# RD_STALL / WR_STALL, AR / AW ranges. SYN synthetic groups (n 1..1024, rows 1..300, 4 KiB edges).
# CYC: single-MACAB runs, CYCLES == pim.md formula (PROF 0). ERR: every ERR cause, FIFO_OVF, FLUSH,
# START_BUSY, SLVERR / DECERR and recovery. COLL: CTRL in the done cycle, W1C vs set. WBLK / RBLK:
# long write / read blocks (write buffer full, y credit, read outstanding limits must be reached).
TOP=tb_pim_top
RTL_FILES="pkg/llm_pkg.sv l0/rshr_sat.sv l0/dotp.sv l0/sync_fifo.sv l0/ram_sdp.sv l1/mac_row.sv l1/gemv_scale.sv l1/axil_slave.sv l1/axi_rd_eng.sv l1/axi_wr_eng.sv l1/pim_gb.sv l1/pim_bank.sv l1/pim_ctrl.sv l2/pim_core.sv l3/pim_csr.sv l3/pim_top.sv"
TB_FILES="common/tb_util_pkg.sv common/axi_mem_slave.sv common/axil_bfm.sv dpi/kdpi_pkg.sv pim_top/tb_pim_top.sv"
DPI=1
NEED="model/build/vec/m1/gemv.bin model/build/vec/m1/rrec.bin model/build/vec/pim/bank0.hex"
M1="+VEC=../../model/build/vec/m1"
RUNS=(
  "q_m1_layer|+SEED=1 +PROF=0 +MAXD=0 $M1 +MODE=0 +CSR=1|pass|q"
  "q_m1_tok_stall|+SEED=2 +PROF=1 +MAXD=2 $M1 +MODE=1 +MAXPOS=2|pass|q"
  "q_syn|+SEED=3 +PROF=1 +MAXD=1 +SYN=60|pass|q"
  "q_cyc|+SEED=4 +PROF=0 +MAXD=0 +CYC=60|pass|q"
  "q_err|+SEED=5 +PROF=0 +MAXD=0 +ERR=1|pass|q"
  "q_coll|+SEED=6 +PROF=0 +MAXD=0 +COLL=1|pass|q"
  "q_blk|+SEED=7 +PROF=1 +MAXD=1 +SYN=80 +WBLK=1 +RBLK=1|pass|q"
  "m1_tok|+SEED=8 +PROF=0 +MAXD=0 $M1 +MODE=1|pass"
  "m1_perrec|+SEED=9 +PROF=1 +MAXD=1 $M1 +MODE=2|pass"
  "m1_layer_stall|+SEED=10 +PROF=2 +MAXD=3 $M1 +MODE=0 +WBLK=1 +RBLK=1|pass"
  "syn_heavy|+SEED=11 +PROF=2 +MAXD=4 +SYN=200 +ERR=1|pass"
  "syn_blk_long|+SEED=12 +PROF=2 +MAXD=2 +SYN=200 +WBLK=1 +RBLK=1|pass"
  "cd4_syn|-gCMD_DEPTH=4 +SEED=13 +PROF=1 +MAXD=1 +SYN=100 +ERR=1|pass"
  "p00_cyc|-gDOT_PIPE=0 -gSCALE_PIPE=0 +SEED=14 +PROF=0 +MAXD=0 +CYC=60 +SYN=60|pass"
  "p44_cyc|-gDOT_PIPE=4 -gSCALE_PIPE=4 +SEED=15 +PROF=0 +MAXD=0 +CYC=60|pass"
  "y8_b8o2|-gY_DEPTH=8 -gMAX_BURST=8 -gOUTS=2 +SEED=16 +PROF=1 +MAXD=1 +SYN=100 +WBLK=1 +ERR=1|pass"
)
