# attn_vacc (rtl/l1/attn_vacc.sv with l0/rshr_sat) against the k_attn2_st stage trace
# (tb/attn_vacc, tb/common/attn_tb_pkg.sv): p[t] with exact latency, w[t] (white-box), every
# acc[i] (white-box) and o[i] read in random order. All attention records of 260K / 15M K12V8,
# HB and HD dumps, synthetic calls (gen_syn modes 0..5), V beats with random gaps.
TOP=tb_attn_vacc
RTL_FILES="pkg/llm_pkg.sv l0/rshr_sat.sv l1/attn_vacc.sv"
TB_FILES="common/tb_util_pkg.sv dpi/kdpi_pkg.sv common/attn_tb_pkg.sv attn_vacc/tb_attn_vacc.sv"
DPI=1
V=../../model/build/vec
NEED="model/build/vec/m1/attn2.bin model/build/vec/m2/attn2.bin model/build/vec/hb1/attn.bin model/build/vec/hd1/attn.bin model/build/vec/hb2/attn.bin model/build/vec/hd2/attn.bin"
RUNS=(
  "q_m1m2|+SEED=1 +VEC=$V/m1,$V/m2 +MAXREC=80 +SYN=60 +GAP=20|pass|q"
  "q_hbhd|+SEED=2 +VEC=$V/hb1,$V/hd2 +MAXREC=40 +SYN=30 +GAP=0|pass|q"
  "m1|+SEED=3 +VEC=$V/m1 +GAP=10|pass"
  "m2|+SEED=4 +VEC=$V/m2 +GAP=30|pass"
  "hbhd|+SEED=5 +VEC=$V/hb1,$V/hd1,$V/hb2,$V/hd2 +GAP=15|pass"
  "syn|+SEED=6 +SYN=1200 +GAP=25|pass"
  "syn_vl4_hs20_t64|-gVL=4 -gHS_MAX=20 -gT_MAX=64 -gACC_W=56 +SEED=7 +SYN=600 +GAP=10|pass"
  "bad_accw|-gACC_W=58|elab_fail:attn_vacc: ACC_W=58 must be 59..62|q"
)
