# rms_front (rtl/l1/rms_front.sv with rshr_sat, rsqrt_nr) with its buffer (ram_sdp) and the shared
# actq_core (f = fy, qmax 127) against k_rmsnorm_st through DPI-C (tb/rms_front): every K_RMSNORM
# record of both models (260K 132 calls n 64, 15M 78 calls n 288), synthetic calls (n 1..N_MAX,
# zero x, one nonzero, -2^31, 2^31 - 1, k 0..17, g extremes, ge / epsc / fy random); stage trace
# (amax, k, ss, u, rm, re, sh), every y, q and scale {m, e}, actq M / R / e; cycle formula without
# stalls; element gaps, q_ready stalls and long blocks (q FIFO full required).
TOP=tb_rms_front
RTL_FILES="pkg/llm_pkg.sv pkg/lut_pkg.sv l0/rshr_sat.sv l0/udiv_seq.sv l0/ram_sdp.sv l0/sync_fifo.sv l0/rsqrt_nr.sv l1/actq_core.sv l1/rms_front.sv"
TB_FILES="common/tb_util_pkg.sv dpi/kdpi_pkg.sv common/vec_tb_pkg.sv rms_front/tb_rms_front.sv"
DPI=1
NEED="model/build/vec/m1/rmsnorm.bin model/build/vec/m2/rmsnorm.bin"
RUNS=(
  "q_cyc|+SEED=1 +VEC1=../../model/build/vec/m1 +VEC2=../../model/build/vec/m2 +NSYN=100 +CYC=1|pass|q"
  "q_stall|+SEED=2 +VEC1=../../model/build/vec/m1 +NSYN=100 +GAP=20 +QSTALL=30 +QBLK=1|pass|q"
  "rec_stall|+SEED=3 +VEC1=../../model/build/vec/m1 +VEC2=../../model/build/vec/m2 +GAP=30 +QSTALL=40 +QBLK=1|pass"
  "syn_cyc|+SEED=4 +NSYN=1500 +CYC=1|pass"
  "syn_stall|+SEED=5 +NSYN=1500 +GAP=10 +QSTALL=50 +QBLK=1|pass"
  "nmax64|-gN_MAX=64 +SEED=6 +NSYN=2000 +GAP=10 +QSTALL=30 +QBLK=1|pass"
)
