# exp_unit (rtl/l1/exp_unit.sv with l0/rshr_sat, l0/lut_lerp) against k_attn_exp (DPI) (tb/exp_unit).
# Every (s[t], mx) of the stage traces of all attention records (260K / 15M K12V8, HB, HD; the
# trace e[t] must equal kd_attn_exp), directed d around 0, exponent steps and the clamp -2^30,
# extreme pairs, s > mx, and random pairs. RS_PIPE / LUT_PIPE sets (1,2), (0,1), (2,3).
TOP=tb_exp_unit
RTL_FILES="pkg/llm_pkg.sv pkg/lut_pkg.sv l0/rshr_sat.sv l0/lut_lerp.sv l1/exp_unit.sv"
TB_FILES="common/tb_util_pkg.sv dpi/kdpi_pkg.sv exp_unit/tb_exp_unit.sv"
DPI=1
NEED="model/build/vec/m1/attn2.bin model/build/vec/m2/attn2.bin model/build/vec/hb1/attn.bin model/build/vec/hd2/attn.bin"
V=../../model/build/vec
RUNS=(
  "q_m1|+SEED=1 +VEC=$V/m1 +MAXREC=120 +N=50000|pass|q"
  "q_p01_m2|-gRS_PIPE=0 -gLUT_PIPE=1 +SEED=2 +VEC=$V/m2 +MAXREC=60 +N=50000|pass|q"
  "m1|+SEED=3 +VEC=$V/m1 +N=500000|pass"
  "m2_p23|-gRS_PIPE=2 -gLUT_PIPE=3 +SEED=4 +VEC=$V/m2 +N=500000|pass"
  "hb1|+SEED=5 +VEC=$V/hb1 +N=100000|pass"
  "hd1|-gRS_PIPE=0 -gLUT_PIPE=1 +SEED=6 +VEC=$V/hd1 +N=100000|pass"
  "hb2|+SEED=7 +VEC=$V/hb2 +N=100000|pass"
  "hd2|-gRS_PIPE=2 -gLUT_PIPE=3 +SEED=8 +VEC=$V/hd2 +N=100000|pass"
  "rnd_1m|+SEED=9 +N=1000000|pass"
)
