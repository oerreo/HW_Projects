# udiv_seq (rtl/l0/udiv_seq.sv) against the C division (tb/udiv_seq). Attention sizes
# (NUM_W 49, DEN_W 26, Q_W 33: R = 2^48 / sum) with directed boundaries (q 0, 1, 2^Q_W - 1,
# den 1 and 2^DEN_W - 1, remainders 0 and den - 1, 2^48 / 2^k +- 1 for k = 16..25) and 10^6
# random operations; actq-like sizes (41/25/25, 32/17/17); exhaustive small sizes (10/5/5,
# 8/3/6); start in the done cycle (gap 0), busy and done timing, hold of q_o.
# Negative: division by zero (UDIV_ZERO), quotient overflow (UDIV_OVF), start while busy
# (UDIV_START, ignored).
TOP=tb_udiv_seq
RTL_FILES="l0/udiv_seq.sv"
TB_FILES="common/tb_util_pkg.sv udiv_seq/tb_udiv_seq.sv"
DPI=0
RUNS=(
  "q_att|+SEED=1 +N=20000|pass|q"
  "q_exh_small|-gNUM_W=10 -gDEN_W=5 -gQ_W=5 +SEED=2 +N=1000 +EXH=1|pass|q"
  "q_neg_zero|+SEED=3 +N=100 +NEG=1|assert:UDIV_ZERO=1|q"
  "q_neg_ovf|+SEED=4 +N=100 +NEG=2|assert:UDIV_OVF=1|q"
  "q_neg_busy|+SEED=5 +N=100 +NEG=3|assert:UDIV_START=1|q"
  "att_1m|+SEED=11 +N=1000000|pass"
  "aq_41_25_25|-gNUM_W=41 -gDEN_W=25 -gQ_W=25 +SEED=12 +N=300000|pass"
  "s_32_17_17|-gNUM_W=32 -gDEN_W=17 -gQ_W=17 +SEED=13 +N=300000|pass"
  "exh_8_3_6|-gNUM_W=8 -gDEN_W=3 -gQ_W=6 +SEED=14 +N=1000 +EXH=1|pass"
  "s_1q|-gNUM_W=12 -gDEN_W=12 -gQ_W=1 +SEED=15 +N=20000|pass"
)
