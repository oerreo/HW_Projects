# gemv_core (rtl/l2/gemv_core.sv with l1/mac_row, l1/gemv_scale, l0/dotp, l0/rshr_sat,
# l0/ram_sdp, l0/sync_fifo) against every K_GEMV record of both models (tb/gemv_core):
# 260K 432 records (12 positions x 36 matrices, all matrices incl. the classifier
# 512 x 64), 15M 258 records (6 positions x 43 matrices incl. the classifier 32000 x 288).
# x and the row records (rrec_pack) are streamed; y is compared with the recorded output.
# nostall runs: every call's cycle count must equal ceil(n/8) + rows*(1 + ceil(n/8)) +
# L_PIPE, and the per-token sum must equal the arch.md 2.4 table (260K 36,446, 15M
# 1,950,260). stall runs: random gaps on x/w and random y_ready (YBLK: plus long y_ready
# blocks, the header credit limit must be reached). syn: synthetic calls
# (n = 1..1024, garbage in padding and header bits) against kd_gemv1. PIPE sets
# (DOT_PIPE, SCALE_PIPE): (2,3) default, (0,0), (4,4), (1,2). LANES is fixed at 8 by the
# spec (one 64-bit beat); the lane sweep is done on dotp / mac_row.
TOP=tb_gemv_core
RTL_FILES="pkg/llm_pkg.sv l0/rshr_sat.sv l0/dotp.sv l0/sync_fifo.sv l0/ram_sdp.sv l1/mac_row.sv l1/gemv_scale.sv l2/gemv_core.sv"
TB_FILES="common/tb_util_pkg.sv dpi/kdpi_pkg.sv gemv_core/tb_gemv_core.sv"
DPI=1
NEED="model/build/vec/m1/gemv.bin model/build/vec/m2/gemv.bin"
M1="+VEC=../../model/build/vec/m1 +RPT=36 +TOK=36446"
M2="+VEC=../../model/build/vec/m2 +RPT=43 +TOK=1950260"
M2Q="+VEC=../../model/build/vec/m2 +MAXREC=43"
RUNS=(
  "q_m1_nostall|+SEED=51 $M1 +STALL=0|pass|q"
  "q_m1_stall|+SEED=52 $M1 +STALL=1 +YBLK=1|pass|q"
  "q_m2tok_nostall|+SEED=53 $M2Q +STALL=0|pass|q"
  "q_m2tok_stall|-gDOT_PIPE=4 -gSCALE_PIPE=4 +SEED=54 $M2Q +STALL=1 +PY=50|pass|q"
  "q_syn|-gDOT_PIPE=0 -gSCALE_PIPE=0 -gY_DEPTH=4 +SEED=55 +SYN=300 +STALL=1|pass|q"
  "m1_p00_nostall|-gDOT_PIPE=0 -gSCALE_PIPE=0 -gY_DEPTH=4 +SEED=1 $M1 +STALL=0|pass"
  "m1_p44_stall|-gDOT_PIPE=4 -gSCALE_PIPE=4 +SEED=2 $M1 +STALL=1 +PY=30|pass"
  "m1_p12_stall|-gDOT_PIPE=1 -gSCALE_PIPE=2 -gY_DEPTH=6 +SEED=3 $M1 +STALL=1 +PY=90|pass"
  "m2_nostall|+SEED=4 $M2 +STALL=0|pass"
  "m2_stall|+SEED=5 $M2 +STALL=1 +YBLK=1|pass"
  "m2_p44_nostall|-gDOT_PIPE=4 -gSCALE_PIPE=4 +SEED=6 $M2 +STALL=0|pass"
  "syn_nostall|+SEED=7 +SYN=2000 +STALL=0|pass"
  "syn_p44_stall|-gDOT_PIPE=4 -gSCALE_PIPE=4 -gY_DEPTH=8 +SEED=8 +SYN=2000 +STALL=1 +PY=40 +YBLK=1|pass"
  "neg_start|+SEED=9 +VEC=../../model/build/vec/m1 +MAXREC=2 +STALL=0 +NEG=1|assert:L2_START=1|q"
  "bad_lanes|-gLANES=16|elab_fail:gemv_core: LANES=16 must be 8|q"
  "bad_ydepth|-gDOT_PIPE=4 -gSCALE_PIPE=4 -gY_DEPTH=7|elab_fail:gemv_core: Y_DEPTH=7 must be >= 8"
)
