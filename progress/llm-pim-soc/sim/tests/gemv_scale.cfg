# gemv_scale (rtl/l1/gemv_scale.sv + l0/rshr_sat.sv) against k_gemv_out (stage A2,
# tb/gemv_scale): every row of the K_GEMV records of both models (acc from the stage A1
# trace, expected y = recorded output), operand corners and 10^6 random inputs.
# PIPE 0..4 (LATENCY = PIPE).
TOP=tb_gemv_scale
RTL_FILES="pkg/llm_pkg.sv l0/rshr_sat.sv l1/gemv_scale.sv"
TB_FILES="common/tb_util_pkg.sv dpi/kdpi_pkg.sv gemv_scale/tb_gemv_scale.sv"
DPI=1
NEED="model/build/vec/m1/gemv.bin model/build/vec/m2/gemv.bin"
V="+VEC=../../model/build/vec/m1 +VEC2=../../model/build/vec/m2"
RUNS=(
  "q_p3|-gPIPE=3 +SEED=41 $V +N=100000|pass|q"
  "p0|-gPIPE=0 +SEED=1 $V|pass"
  "p1|-gPIPE=1 +SEED=2 $V|pass"
  "p2|-gPIPE=2 +SEED=3 $V|pass"
  "p3|-gPIPE=3 +SEED=4 $V|pass"
  "p4|-gPIPE=4 +SEED=5 $V|pass"
  "bad_pipe|-gPIPE=5|elab_fail:gemv_scale: PIPE=5 must be 0..4|q"
  "bad_accw|-gACC_W=30|elab_fail:gemv_scale: ACC_W=30 must be 2..29"
)
