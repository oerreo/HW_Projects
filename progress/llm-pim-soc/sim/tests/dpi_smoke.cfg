# DPI-C smoke test of the golden wrapper (tb/dpi/kdpi.c + model/src): every record of the
# K12V8 kernel files (model/build/vec, "make vec" in model/) replays through DPI to its
# recorded output; gemv stage functions, row records and the PIM bank image agree with the
# records and with the vt files. m2 (15M) is limited to the first 50 records per kernel.
TOP=tb_dpi_smoke
RTL_FILES=""
TB_FILES="common/tb_util_pkg.sv common/axi_mem_slave.sv dpi/kdpi_pkg.sv dpi/tb_dpi_smoke.sv"
DPI=1
NEED="model/build/vec/m1/gemv.bin model/build/vec/m2/gemv.bin model/build/vec/pim/bank0.hex model/build/vec/m1/rrec.bin model/build/vec/m2/rrec.bin"
RUNS=(
  "m1|+VEC=../../model/build/vec/m1 +PIM_DIR=../../model/build/vec/pim +RFILE|pass|q"
  "m2|+VEC=../../model/build/vec/m2 +MAXREC=50 +RFILE|pass"
)
