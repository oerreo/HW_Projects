# rshr_sat (rtl/l0/rshr_sat.sv) against k_rshr / k_sat32 through DPI-C (tb/rshr_sat).
# Directed (shift -70..70 and edges, extremes, rounding halves), saturation boundaries on
# both sides for every left shift, then +N random (10^6 per parameter set in the full
# runs). SAT_MODE 0 with OUT_W 32 is sat32(k_rshr); OUT_W 17 checks the generic clamp;
# SAT_MODE 1 is k_rshr itself (OUT_W 64). Quick tier: q runs with +N=100000.
TOP=tb_rshr_sat
RTL_FILES="pkg/llm_pkg.sv l0/rshr_sat.sv"
TB_FILES="common/tb_util_pkg.sv dpi/kdpi_pkg.sv rshr_sat/tb_rshr_sat.sv"
DPI=1
RUNS=(
  "q58_32_p1|-gIN_W=58 -gOUT_W=32 -gSAT_MODE=0 -gPIPE=1 +SEED=11 +N=100000|pass|q"
  "q62_64_m1_p2|-gIN_W=62 -gOUT_W=64 -gSAT_MODE=1 -gPIPE=2 +SEED=12 +N=100000|pass|q"
  "s58_32_p0|-gIN_W=58 -gOUT_W=32 -gSAT_MODE=0 -gPIPE=0 +SEED=1 +N=1000000|pass"
  "s58_32_p1|-gIN_W=58 -gOUT_W=32 -gSAT_MODE=0 -gPIPE=1 +SEED=2 +N=1000000|pass"
  "s58_32_p2|-gIN_W=58 -gOUT_W=32 -gSAT_MODE=0 -gPIPE=2 +SEED=3 +N=1000000|pass"
  "s32_32_p1|-gIN_W=32 -gOUT_W=32 -gSAT_MODE=0 -gPIPE=1 +SEED=4 +N=1000000|pass"
  "s48_17_p2|-gIN_W=48 -gOUT_W=17 -gSAT_MODE=0 -gPIPE=2 +SEED=5 +N=1000000|pass"
  "s62_64_m1_p0|-gIN_W=62 -gOUT_W=64 -gSAT_MODE=1 -gPIPE=0 +SEED=6 +N=1000000|pass"
  "s40_64_m1_p1|-gIN_W=40 -gOUT_W=64 -gSAT_MODE=1 -gPIPE=1 +SEED=7 +N=1000000|pass"
  "s33_64_m1_p2|-gIN_W=33 -gOUT_W=64 -gSAT_MODE=1 -gPIPE=2 +SEED=8 +N=1000000|pass"
  "bad_pipe|-gPIPE=3|elab_fail:rshr_sat: PIPE=3 must be 0..2|q"
  "bad_inw|-gIN_W=63|elab_fail:rshr_sat: IN_W=63 must be 2..62"
  "bad_m1_outw|-gSAT_MODE=1 -gOUT_W=32|elab_fail:rshr_sat: OUT_W=32 must be 64 for SAT_MODE 1"
)
