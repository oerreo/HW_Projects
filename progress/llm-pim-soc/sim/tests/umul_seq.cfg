# umul_seq (rtl/l0/umul_seq.sv) against the exact product (tb/umul_seq, 128-bit TB arithmetic).
# Directed operand pairs (0, 1, 2, max - 1, max, 2^k and 2^k +- 1, alternating bits, every pair),
# 10^6 random operations at the default size (A_W 25, B_W 9), the sizes used by the CSRs
# (33 x 8, 16 x 16, 24 x 8), the extremes 1 x 1 and 64 x 64, exhaustive small sizes, start in the
# done cycle (gap 0), busy and done timing, hold of p_o.
# Negative: start while busy (UMUL_START, ignored), X operand (UMUL_X), illegal A_W (elaboration).
TOP=tb_umul_seq
RTL_FILES="l0/umul_seq.sv"
TB_FILES="common/tb_util_pkg.sv umul_seq/tb_umul_seq.sv"
DPI=0
RUNS=(
  "q_def|+SEED=1 +N=20000|pass|q"
  "q_exh_6_5|-gA_W=6 -gB_W=5 +SEED=2 +N=1000 +EXH=1|pass|q"
  "q_neg_busy|+SEED=3 +N=100 +NEG=1|assert:UMUL_START=1|q"
  "q_neg_x|+SEED=4 +N=100 +NEG=2|assert:UMUL_X=1|q"
  "def_1m|+SEED=11 +N=1000000|pass"
  "s_33_8|-gA_W=33 -gB_W=8 +SEED=12 +N=300000|pass"
  "s_16_16|-gA_W=16 -gB_W=16 +SEED=13 +N=300000|pass"
  "s_24_8|-gA_W=24 -gB_W=8 +SEED=14 +N=300000|pass"
  "s_64_64|-gA_W=64 -gB_W=64 +SEED=15 +N=100000|pass"
  "exh_1_1|-gA_W=1 -gB_W=1 +SEED=16 +N=1000 +EXH=1|pass"
  "exh_1_7|-gA_W=1 -gB_W=7 +SEED=17 +N=1000 +EXH=1|pass"
  "exh_8_2|-gA_W=8 -gB_W=2 +SEED=18 +N=1000 +EXH=1|pass"
  "bad_aw|-gA_W=65|elab_fail:umul_seq: A_W=65 must be 1..64"
)
