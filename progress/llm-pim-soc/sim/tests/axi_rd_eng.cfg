# axi_rd_eng (rtl/l1/axi_rd_eng.sv, buffer rtl/l0/sync_fifo.sv) against the AXI slave memory
# model (tb/axi_rd_eng). Reference: memory contents (beat k == word at addr + 8k), AR split
# rule (min(remaining, burst limit, beats to 4 KiB)), outstanding limit, R never stalled,
# status outputs every cycle. The memory model's MAX_LEN is MAX_BURST - 1, so a burst longer
# than MAX_BURST is an AXI_LEN error. Parameter sets (MAX_BURST, OUTS, FIFO_DEPTH): burst 1, 8,
# 16, 256; outstanding 1, 2, 4, 8; buffer smaller than OUTS x MAX_BURST and not a power of two.
# PROF memory stalls/latency, DPROF consumer ready, GAP command gaps, BLK long consumer blocks
# (buffer must fill), OREACH outstanding limit must be reached, TPUT throughput (2: exactly 1
# beat/cycle required), ERRINJ SLVERR/DECERR windows. NEG: one illegal command each.
TOP=tb_axi_rd_eng
RTL_FILES="l0/sync_fifo.sv l1/axi_rd_eng.sv"
TB_FILES="common/tb_util_pkg.sv common/axi_mem_slave.sv axi_rd_eng/tb_axi_rd_eng.sv"
DPI=0
RUNS=(
  "q_b16o4|+SEED=1 +PROF=1 +DPROF=1 +GAP=20|pass|q"
  "q_b16o4_tput|+SEED=2 +PROF=0 +DPROF=0 +GAP=0 +N_CMD=200 +TPUT=2 +OREACH=1|pass|q"
  "q_b16o4_blk|+SEED=3 +PROF=1 +DPROF=2 +GAP=0 +BLK=1 +ERRINJ=1|pass|q"
  "q_b256o2|-gMAX_BURST=256 -gOUTS=2 +SEED=4 +PROF=1 +DPROF=1 +BLK=1 +OREACH=1 +TPUT=1|pass|q"
  "b16o4_heavy|+SEED=5 +PROF=2 +DPROF=2 +GAP=0 +N_CMD=600|pass"
  "b16o4_gap|+SEED=6 +PROF=1 +DPROF=0 +GAP=60 +N_CMD=600 +ERRINJ=1|pass"
  "b1o1|-gMAX_BURST=1 -gOUTS=1 +SEED=7 +PROF=1 +DPROF=1 +N_CMD=150 +MAXB=8192 +TPUT=1 +OREACH=1 +BLK=1|pass"
  "b1o4|-gMAX_BURST=1 -gOUTS=4 +SEED=8 +PROF=1 +DPROF=1 +N_CMD=150 +MAXB=8192 +TPUT=1 +OREACH=1|pass"
  "b16o1|-gOUTS=1 +SEED=9 +PROF=1 +DPROF=1 +TPUT=1 +OREACH=1 +BLK=1|pass"
  "b16o2|-gOUTS=2 +SEED=10 +PROF=2 +DPROF=2 +BLK=1 +OREACH=1|pass"
  "b16o4_fd24|-gFIFO_DEPTH=24 +SEED=11 +PROF=1 +DPROF=1 +BLK=1 +OREACH=1 +TPUT=1|pass"
  "b256o4|-gMAX_BURST=256 -gOUTS=4 +SEED=12 +PROF=2 +DPROF=1 +MAXB=65536 +BLK=1 +OREACH=1 +TPUT=2|pass"
  "b256o1_fd256|-gMAX_BURST=256 -gOUTS=1 -gFIFO_DEPTH=256 +SEED=13 +PROF=1 +DPROF=2 +BLK=1 +OREACH=1|pass"
  "b8o8|-gMAX_BURST=8 -gOUTS=8 +SEED=14 +PROF=1 +DPROF=1 +ERRINJ=1 +OREACH=1 +TPUT=1|pass"
  "neg_hold|+SEED=21 +PROF=1 +DPROF=1 +N_CMD=20 +NEG=1|assert:VR_HOLD=1|q"
  "neg_stable|+SEED=22 +PROF=1 +DPROF=1 +N_CMD=20 +NEG=2|assert:VR_STABLE=1"
  "neg_align|+SEED=23 +PROF=1 +DPROF=1 +N_CMD=20 +NEG=3|assert:ENG_CMD=1|q"
  "neg_zero|+SEED=24 +PROF=1 +DPROF=1 +N_CMD=20 +NEG=4|assert:ENG_CMD=1"
  "neg_wrap|+SEED=25 +PROF=1 +DPROF=1 +N_CMD=20 +NEG=5|assert:ENG_CMD=1"
  "bad_burst0|-gMAX_BURST=0|elab_fail:axi_rd_eng: MAX_BURST=0 must be 1..256|q"
  "bad_burst257|-gMAX_BURST=257|elab_fail:axi_rd_eng: MAX_BURST=257 must be 1..256"
  "bad_outs0|-gOUTS=0|elab_fail:axi_rd_eng: OUTS=0 must be 1..64"
  "bad_fifo|-gFIFO_DEPTH=8|elab_fail:axi_rd_eng: FIFO_DEPTH=8 must be >= MAX_BURST=16"
)
