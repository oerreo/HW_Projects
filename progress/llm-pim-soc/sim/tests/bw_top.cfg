# bw_top (rtl/l3/bw_top.sv with l1/axil_slave, l1/axi_rd_eng, l1/axi_wr_eng, l0/sync_fifo):
# HP bandwidth measurement top driven over AXI4-Lite (tb/common/axil_bfm.sv), one AXI memory
# model per port (tb/bw_top). Every op: checksums vs memory (TB), written memory vs the
# pattern formula and guard bytes, CYCLES / RD_CYC / WR_CYC from the bus handshake times,
# RD_STALL = RD_CYC - 1 - beats, beat counters, STATUS / ERR / OPS. Plus CSR reset values and
# read-back, unused addresses, every BAD_DESC rule, BAD_OP, START_BUSY, ENG_CMD (range past
# 2^32), RD_RESP / WR_RESP (injected SLVERR / DECERR). P = 1 and 2, burst / outstanding sets.
# PROF memory stalls/latency, MAXD AXI-Lite gaps, N_OP random ops after the directed ones.
TOP=tb_bw_top
RTL_FILES="l0/sync_fifo.sv l1/axil_slave.sv l1/axi_rd_eng.sv l1/axi_wr_eng.sv l3/bw_top.sv"
TB_FILES="common/tb_util_pkg.sv common/axi_mem_slave.sv common/axil_bfm.sv bw_top/tb_bw_top.sv"
DPI=0
RUNS=(
  "q_p1|-gP=1 +SEED=1 +PROF=1 +MAXD=2 +N_OP=30|pass|q"
  "q_p2|-gP=2 +SEED=2 +PROF=1 +MAXD=2 +N_OP=30|pass|q"
  "p1_nostall|-gP=1 +SEED=3 +PROF=0 +MAXD=0 +N_OP=60|pass"
  "p2_nostall|-gP=2 +SEED=4 +PROF=0 +MAXD=0 +N_OP=60|pass"
  "p1_heavy|-gP=1 +SEED=5 +PROF=2 +MAXD=4 +N_OP=40|pass"
  "p2_heavy|-gP=2 +SEED=6 +PROF=2 +MAXD=4 +N_OP=40|pass"
  "p2_b256o2|-gP=2 -gMAX_BURST=256 -gOUTS=2 +SEED=7 +PROF=1 +MAXD=1 +N_OP=40|pass"
  "p1_b1o1|-gP=1 -gMAX_BURST=1 -gOUTS=1 +SEED=8 +PROF=1 +MAXD=1 +N_OP=20|pass"
  "p2_b8o8|-gP=2 -gMAX_BURST=8 -gOUTS=8 +SEED=9 +PROF=2 +MAXD=1 +N_OP=40|pass"
  "bad_p3|-gP=3|elab_fail:bw_top: P=3 must be 1 or 2|q"
)
