# sync_fifo (rtl/l0/sync_fifo.sv) against a queue reference model (tb/sync_fifo): random
# valid/ready phases (fill to full, drain to empty, simultaneous push and pop), DEPTH
# power of two and not, DEPTH 1. Negative runs inject one producer protocol violation
# each and expect exactly one message of its tag (data checks still pass).
TOP=tb_sync_fifo
RTL_FILES="l0/sync_fifo.sv"
TB_FILES="common/tb_util_pkg.sv sync_fifo/tb_sync_fifo.sv"
DPI=0
RUNS=(
  "d16|-gW=16 -gDEPTH=16 +SEED=1|pass|q"
  "d5|-gW=8 -gDEPTH=5 +SEED=2|pass|q"
  "d1|-gW=8 -gDEPTH=1 +SEED=3|pass"
  "d2|-gW=32 -gDEPTH=2 +SEED=4|pass"
  "d64|-gW=33 -gDEPTH=64 +SEED=5 +N=400000|pass"
  "d12|-gW=32 -gDEPTH=12 +SEED=6 +N=400000|pass"
  "neg_hold|-gW=16 -gDEPTH=4 +SEED=7 +N=20000 +NEG=1|assert:VR_HOLD=1|q"
  "neg_stable|-gW=16 -gDEPTH=4 +SEED=8 +N=20000 +NEG=2|assert:VR_STABLE=1"
  "neg_x|-gW=16 -gDEPTH=4 +SEED=9 +N=20000 +NEG=3|assert:VR_X=1"
  "bad_depth|-gDEPTH=0|elab_fail:sync_fifo: DEPTH=0 must be >= 1|q"
)
