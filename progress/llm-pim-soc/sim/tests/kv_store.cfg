# kv_store (rtl/l2/kv_store.sv with l0/ram_sdp, l0/sync_fifo) against a TB shadow memory
# (tb/kv_store). Every slot written (kv head x layer x position) plus random rewrites, then
# concurrent pass requests on all ports (kv head of the port, T 1..SEQ, K or V pass): beats ==
# shadow (lanes sign-extended from KW / VW bits, scales), exactly T beats. Random consumer ready
# and long blocks (port FIFO must fill), always-ready throughput (T + 3 cycles), H_PAR 1 / 2 / 4,
# K16V16 words. Negative: request on the wrong port, K outside KW bits (L2_RANGE).
TOP=tb_kv_store
RTL_FILES="pkg/llm_pkg.sv l0/ram_sdp.sv l0/sync_fifo.sv l2/kv_store.sv"
TB_FILES="common/tb_util_pkg.sv kv_store/tb_kv_store.sv"
DPI=0
RUNS=(
  "q_hp2|+SEED=1 +NW=2000 +NP=30 +PY=70 +BLK=1|pass|q"
  "q_thr|+SEED=2 +NW=100 +NP=20 +PY=100|pass|q"
  "q_neg_port|+SEED=3 +NW=10 +NP=2 +NEG=1|assert:L2_RANGE=1|q"
  "q_neg_kw|+SEED=4 +NW=10 +NP=2 +NEG=2|assert:L2_RANGE=1|q"
  "hp1|-gH_PAR=1 +SEED=5 +NW=5000 +NP=80 +PY=60 +BLK=1|pass"
  "hp4_fd2|-gH_PAR=4 -gFIFO_D=2 +SEED=6 +NW=5000 +NP=60 +PY=50 +BLK=1|pass"
  "k16v16|-gKW=16 -gVW=16 -gNL=2 -gSEQ=128 +SEED=7 +NW=3000 +NP=80 +PY=80|pass"
  "thr_hp4|-gH_PAR=4 +SEED=8 +NW=100 +NP=40 +PY=100|pass"
)
