# kv_rd (rtl/l2/kv_rd.sv) with l1/axi_rd_eng on the AXI memory model (tb/kv_rd): golden buffer
# layout (K / V rows of hs elements of 1 or 2 bytes, {int32 m, int32 e} scales), random T (chunk
# edges CH-1, CH, CH+1, up to TMAX), hs multiples of 8, K and V passes; every beat == reference
# (K pass with both scale pairs). Memory stalls and latency, consumer stalls with long blocks (the
# engine read buffer must fill), CH 16 / 1 / 5, HS_MAX 8 (260K size).
TOP=tb_kv_rd
RTL_FILES="pkg/llm_pkg.sv l0/sync_fifo.sv l1/axi_rd_eng.sv l2/kv_rd.sv"
TB_FILES="common/tb_util_pkg.sv common/axi_mem_slave.sv kv_rd/tb_kv_rd.sv"
DPI=0
RUNS=(
  "q_base|+SEED=1 +NREQ=40 +MSTALL=0 +PY=100|pass|q"
  "q_stall|+SEED=2 +NREQ=40 +MSTALL=1 +PY=60 +BLK=1|pass|q"
  "nostall_200|+SEED=3 +NREQ=200 +MSTALL=0 +PY=100|pass"
  "stall_200|+SEED=4 +NREQ=200 +MSTALL=1 +PY=50 +BLK=1|pass"
  "ch1|-gCH=1 +SEED=5 +NREQ=100 +MSTALL=1 +PY=70 +BLK=1|pass"
  "ch5_hs8|-gCH=5 -gHS_MAX=8 +SEED=6 +NREQ=150 +MSTALL=1 +PY=80|pass"
  "b4o1|-gMAX_BURST=4 -gOUTS=1 +SEED=7 +NREQ=100 +MSTALL=1 +PY=70 +BLK=1|pass"
)
