# pim_ctrl (rtl/l1/pim_ctrl.sv) alone against a reference of the command sequences
# (tb/pim_ctrl, docs/spec/pim.md, model/src/bank.c BANK_ROW / bimg_pack / bank_stat_t): engine
# commands, gb loads, bank writes (word assembly, lane mask, tag, zero slots of the last round),
# MAC reads (mask, word, first / last), gathers (bank order, last, xm, sh), events, busy / idle;
# timing rules (consecutive words, round spacing >= NB, gather L_BANK after the last word, y FIFO
# model <= Y_DEPTH). Records: LDW of the 36 260K matrices -> shadow banks == bank<b>.hex
# (bimg_pack) and the words above the image unchanged; MACAB of every K_GEMV record with the
# layer-order WRGBs. STALL=0: done_mac_o cycle == schedule formula. YBLK: long y_ready blocks, a
# round must wait for y credit. NEG: an illegal op reaching the controller (PIM_RANGE once).
TOP=tb_pim_ctrl
RTL_FILES="pkg/llm_pkg.sv l0/umul_seq.sv l1/pim_ctrl.sv"
TB_FILES="common/tb_util_pkg.sv dpi/kdpi_pkg.sv pim_ctrl/tb_pim_ctrl.sv"
DPI=1
NEED="model/build/vec/m1/gemv.bin model/build/vec/pim/bank0.hex"
M1="+VEC=../../model/build/vec/m1"
RUNS=(
  "q_m1_nostall|+SEED=1 $M1 +STALL=0|pass|q"
  "q_m1_stall|+SEED=2 $M1 +MAXREC=72 +STALL=1 +YBLK=1|pass|q"
  "q_syn_nostall|+SEED=3 +SYN=400 +STALL=0|pass|q"
  "q_syn_stall|+SEED=4 +SYN=400 +STALL=1 +YBLK=1|pass|q"
  "syn_long|+SEED=5 +SYN=3000 +STALL=1 +YBLK=1|pass"
  "y8_syn|-gY_DEPTH=8 +SEED=6 +SYN=800 +STALL=1 +YBLK=1|pass"
  "y4_syn|-gY_DEPTH=4 +SEED=7 +SYN=400 +STALL=0|pass"
  "lb2_syn|-gL_BANK=2 +SEED=8 +SYN=800 +STALL=0|pass"
  "lb9_syn|-gL_BANK=9 +SEED=9 +SYN=800 +STALL=1|pass"
  "nb8_syn|-gNB=8 -gY_DEPTH=64 +SEED=10 +SYN=800 +STALL=0|pass"
  "nb2_syn|-gNB=2 +SEED=11 +SYN=800 +STALL=1 +YBLK=1|pass"
  "m1_stall|+SEED=12 $M1 +STALL=1|pass"
  "neg_op|+SEED=13 +NEG=1|assert:PIM_RANGE=1|q"
  "bad_nb|-gNB=3|elab_fail:pim_ctrl: NB=3 must be a power of two|q"
)
