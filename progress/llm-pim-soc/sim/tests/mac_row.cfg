# mac_row (rtl/l1/mac_row.sv + l0/dotp.sv) against the golden row sums (tb/mac_row): every
# row of the K_GEMV records (stage A1, kd_rec_gemv_acc = k_dot8 of the row), directed
# extremes and random rows n = 1..N_MAX against kd_dot8. LANES 8 (gemv) and 16 (PIM bank),
# DOT_PIPE over 0..log2(LANES)+1. ovf: one all -128 x -128 row of N_MAX (2^24, one bit
# more than ACC_W 25) must raise exactly one L1_RANGE message.
TOP=tb_mac_row
RTL_FILES="l0/dotp.sv l1/mac_row.sv"
TB_FILES="common/tb_util_pkg.sv dpi/kdpi_pkg.sv mac_row/tb_mac_row.sv"
DPI=1
NEED="model/build/vec/m1/gemv.bin model/build/vec/m2/gemv.bin"
M1=+VEC=../../model/build/vec/m1
M2=+VEC=../../model/build/vec/m2
RUNS=(
  "q_m1_l8_p2|-gLANES=8 -gDOT_PIPE=2 +SEED=31 $M1|pass|q"
  "q_m2_l16_p5|-gLANES=16 -gDOT_PIPE=5 +SEED=32 $M2 +MAXREC=8 +NRND=5000|pass|q"
  "m1_l8_p0|-gLANES=8 -gDOT_PIPE=0 +SEED=1 $M1 +NRND=50000|pass"
  "m1_l16_p2|-gLANES=16 -gDOT_PIPE=2 +SEED=2 $M1 +NRND=50000|pass"
  "m2_l8_p4|-gLANES=8 -gDOT_PIPE=4 +SEED=3 $M2|pass"
  "m2_l16_p0|-gLANES=16 -gDOT_PIPE=0 +SEED=4 $M2|pass"
  "rnd_l4_p1|-gLANES=4 -gDOT_PIPE=1 +SEED=5 +NRND=50000|pass"
  "ovf|-gLANES=8 -gDOT_PIPE=2 +SEED=6 +NRND=1000 +OVF=1|assert:L1_RANGE=1|q"
  "bad_accw|-gACC_W=24|elab_fail:mac_row: ACC_W=24 must be 25..64|q"
)
