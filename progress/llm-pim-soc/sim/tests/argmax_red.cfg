# argmax_red (rtl/l0/argmax_red.sv) against the golden k_argmax (DPI kd_argmax) and every
# K_ARGMAX record of both models (tb/argmax_red): 260K 12 records (n = 512), 15M 6 records
# (n = 32000). Random streams: n = 1, 2, 3, 2^IDX_W and random lengths, full-range / small-range
# (ties) / all-equal / INT32 extremes / monotonic / ties at both ends. GAP percent idle cycles,
# back-to-back streams (first_i in the done_o cycle), RESTART unfinished streams cut by a new
# first_i. NEG=1 element outside a stream (L0_SEQ), NEG=2 2^IDX_W + 1 elements (L0_RANGE).
TOP=tb_argmax_red
RTL_FILES="l0/argmax_red.sv"
TB_FILES="common/tb_util_pkg.sv dpi/kdpi_pkg.sv argmax_red/tb_argmax_red.sv"
DPI=1
NEED="model/build/vec/m1/argmax.bin model/build/vec/m2/argmax.bin"
RUNS=(
  "q_m1|+SEED=1 +VEC=../../model/build/vec/m1 +N_RND=400 +GAP=20 +RESTART=1|pass|q"
  "q_m2|+SEED=2 +VEC=../../model/build/vec/m2 +GAP=0|pass|q"
  "q_w4|-gIDX_W=4 +SEED=3 +N_RND=3000 +GAP=30 +RESTART=1|pass|q"
  "rnd_nogap|+SEED=4 +N_RND=3000 +GAP=0 +RESTART=1|pass"
  "rnd_gap|+SEED=5 +N_RND=3000 +GAP=60|pass"
  "w1|-gIDX_W=1 +SEED=6 +N_RND=500 +GAP=10 +RESTART=1|pass"
  "neg_seq|-gIDX_W=4 +SEED=7 +N_RND=20 +NEG=1|assert:L0_SEQ=1|q"
  "neg_range|-gIDX_W=4 +SEED=8 +N_RND=20 +NEG=2|assert:L0_RANGE=1|q"
  "bad_w0|-gIDX_W=0|elab_fail:argmax_red: IDX_W=0 must be 1..31|q"
)
