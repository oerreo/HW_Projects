# zeta_rom (L2): per-ALGO zeta / gamma / K2 ROM against the golden mlkem_dpi_rom via DPI-C.
# Items per run (tb/l2/tb_zeta_rom.sv): sweep of every zeta and gamma address + K2 at
# two addresses (258 reads), N_RAND=20000 random reads with 25 % en_i gaps, data hold
# while en_i = 0 (OUT_REG = 1), and the committed rtl/l2/rom/*.hex files against the DPI.
# Label <algo>_o<OUT_REG>: OUT_REG = 1 synchronous read (default), 0 combinational.
TOP=tb_zeta_rom
RTL_FILES="pkg/mlkem_pkg.sv l2/ntt_l2_pkg.sv l2/rom/zeta_rom_pkg.sv l2/zeta_rom.sv"
TB_FILES="common/tb_util_pkg.sv common/mlkem_dpi_pkg.sv l2/tb_zeta_rom.sv"
DPI=1
RUNS=(
  "barrett_o1|-gALGO=0 -gOUT_REG=1 +SEED=1|pass"
  "mont12_o1|-gALGO=1 -gOUT_REG=1 +SEED=2|pass"
  "shiftadd_o1|-gALGO=2 -gOUT_REG=1 +SEED=3|pass"
  "k2red_o1|-gALGO=3 -gOUT_REG=1 +SEED=4|pass"
  "barrett_o0|-gALGO=0 -gOUT_REG=0 +SEED=5|pass"
  "mont12_o0|-gALGO=1 -gOUT_REG=0 +SEED=6|pass"
  "shiftadd_o0|-gALGO=2 -gOUT_REG=0 +SEED=7|pass"
  "k2red_o0|-gALGO=3 -gOUT_REG=0 +SEED=8|pass"
  "badoutreg|-gALGO=0 -gOUT_REG=2|elab_fail:zeta_rom: OUT_REG=2 not supported"
)
