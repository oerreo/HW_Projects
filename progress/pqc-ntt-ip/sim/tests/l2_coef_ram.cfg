# coef_ram (L2): 256 x 12b true dual-port bank RAM against a behavioral reference array.
# Items per run (tb/l2/tb_coef_ram.sv): fill (all addresses, both ports in the same
# cycle), same-address read/read sweep, N_OPS random cycles with independent idle /
# read / write per port and a hot address window, read data (latency 1), read data hold
# ("no change" mode, also across writes), final backdoor compare.
# Forbidden-collision run coll (+COLL_TEST): L2_RAM_WW must fire 3 times, L2_RAM_RW
# 4 times (assert: expect type). Quick tier: runs with 4th field q.
TOP=tb_coef_ram
RTL_FILES="pkg/mlkem_pkg.sv l2/ntt_l2_pkg.sv l2/coef_ram.sv"
TB_FILES="common/tb_util_pkg.sv l2/tb_coef_ram.sv"
DPI=0
RUNS=(
  "rand_s1|+SEED=1 +N_OPS=200000|pass|q"
  "rand_s2|+SEED=2 +N_OPS=200000|pass"
  "coll|+SEED=3 +N_OPS=20000 +COLL_TEST|assert:L2_RAM_WW=3,L2_RAM_RW=4|q"
)
