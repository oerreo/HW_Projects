# mod_red ALGO=1 (mont12), Catapult HLS build for the asic library: the unchanged
# tb_mod_red with the HLS wrapper hls/l0/wrap/mod_red.sv in place of the hand
# RTL. Same runs, stimulus and checks as l0_mod_red_mont12.cfg: exhaustive over the
# variant domain against the golden mont12_reduce via DPI-C.
# PIPE 0/1/2 select the Catapult builds c0/p1/p2 (latency 0/1/2).
# RTL_FILES are relative to <project>/rtl (run.sh default RTL_DIR).
TOP=tb_mod_red
RTL_FILES="pkg/mlkem_pkg.sv ../hls/l0/wrap/hls_l0_lib_asic.sv ../hls/l0/out/mod_red_mont12_asic_c0/concat_rtl.v ../hls/l0/out/mod_red_mont12_asic_p1/concat_rtl.v ../hls/l0/out/mod_red_mont12_asic_p2/concat_rtl.v ../hls/l0/wrap/mod_red.sv"
TB_FILES="common/tb_util_pkg.sv common/mlkem_dpi_pkg.sv l0/tb_mod_red.sv"
DPI=1
RUNS=(
  "pipe0|-gALGO=1 -gPIPE=0 +SEED=1 +GAP_PCT=0|pass"
  "pipe1|-gALGO=1 -gPIPE=1 +SEED=1 +GAP_PCT=25|pass"
  "pipe2|-gALGO=1 -gPIPE=2 +SEED=1 +GAP_PCT=25|pass"
  "oor|-gALGO=1 -gPIPE=1 +SEED=1 +OOR_TEST|oor:3"
  "badpipe|-gALGO=1 -gPIPE=3|elab_fail:PIPE=3 not supported"
)
