# bfu ALGO=3 (k2red): L1 unified butterfly against the golden mlkem_dpi_bfu via DPI-C.
# Items per run (tb/l1/tb_bfu.sv): edge 7^3 x 2 modes, ROM z (zeta 128 + gamma 128
# + K2) x N_ROM=2000 x 2 modes, random N_RAND=2e6 per mode, mixed-mode stream
# N_MIX=1e6 at gap 0 % and 1e6 at gap 25 %, replay of hw_{ntt,intt,basemul}_trace_k2red.txt.
# Label pPmMrRoO: PRE_REG=P MUL_REG=M RED_PIPE=R OUT_REG=O, LATENCY = P + M + R + O.
# All 24 pipeline combinations run with SHARE_ADDSUB=0 (separate pre/post add+sub,
# mode may change every cycle). Labels s_*: SHARE_ADDSUB=1 (one shared add/sub
# pair), where the mixed stream is replaced by mode-fixed bursts and every mode
# switch is preceded by LATENCY idle cycles (traffic rule of the shared variant).
# Out-of-range run: tb_bfu +OOR_TEST fires L1_RANGE 4 times and L0_RANGE 6 times.
# sim/run.sh "oor:<n>" counts only L0_RANGE lines and requires them to equal all
# Error lines, so this run cannot be expressed here without changing run.sh; it is
# run by hand (see the P3-1 report).
TOP=tb_bfu
RTL_FILES="pkg/mlkem_pkg.sv l0/mod_add.sv l0/mod_sub.sv l0/mod_half.sv l0/mod_red_barrett.sv l0/mod_red_mont12.sv l0/mod_red_shiftadd.sv l0/mod_red_k2red.sv l0/mod_red.sv l0/mod_mul.sv l1/bfu.sv"
TB_FILES="common/tb_util_pkg.sv common/mlkem_dpi_pkg.sv l1/tb_bfu.sv"
DPI=1
RUNS=(
