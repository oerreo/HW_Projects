# mod_mul ALGO=2 (shiftadd), Catapult HLS build for the asic library: the unchanged
# tb_mod_mul with the HLS wrapper hls/l0/wrap/mod_mul.sv in place of the hand
# RTL. Exhaustive Q^2 over a, b in [0, Q) against the golden shiftadd_reduce(a * b)
# via DPI-C, same stimulus and checks as l0_mod_mul_shiftadd.cfg.
# The HLS build has one register placement per latency (chosen by Catapult),
# so one run per LATENCY = MUL_REG + RED_PIPE: lat0/lat1/lat2 select the
# Catapult builds c0/p1/p2. LATENCY 3 has no HLS build (badlat).
# RTL_FILES are relative to <project>/rtl (run.sh default RTL_DIR).
TOP=tb_mod_mul
RTL_FILES="pkg/mlkem_pkg.sv ../hls/l0/wrap/hls_l0_lib_asic.sv ../hls/l0/out/mod_mul_shiftadd_asic_c0/concat_rtl.v ../hls/l0/out/mod_mul_shiftadd_asic_p1/concat_rtl.v ../hls/l0/out/mod_mul_shiftadd_asic_p2/concat_rtl.v ../hls/l0/wrap/mod_mul.sv"
TB_FILES="common/tb_util_pkg.sv common/mlkem_dpi_pkg.sv l0/tb_mod_mul.sv"
DPI=1
RUNS=(
  "lat0|-gALGO=2 -gMUL_REG=0 -gRED_PIPE=0 +SEED=1 +GAP_PCT=0|pass"
  "lat1|-gALGO=2 -gMUL_REG=0 -gRED_PIPE=1 +SEED=1 +GAP_PCT=25|pass"
  "lat2|-gALGO=2 -gMUL_REG=0 -gRED_PIPE=2 +SEED=1 +GAP_PCT=25|pass"
  "oor|-gALGO=2 -gMUL_REG=0 -gRED_PIPE=1 +SEED=1 +OOR_TEST|oor:3"
  "badmul|-gALGO=2 -gMUL_REG=2 -gRED_PIPE=0|elab_fail:mod_mul: MUL_REG=2 not supported"
  "badred|-gALGO=2 -gMUL_REG=0 -gRED_PIPE=3|elab_fail:mod_mul: RED_PIPE=3 not supported"
  "badlat|-gALGO=2 -gMUL_REG=1 -gRED_PIPE=2|elab_fail:no asic build for ALGO=shiftadd LATENCY=3"
)
