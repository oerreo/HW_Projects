# axil_slave (L4) alone: AXI4-Lite channel handling against a register-side memory model
# (read data = function of address and read count) in tb/l4/tb_axil_slave.sv.
# Each run: directed latency (c, c+1, c+2 for AW/W same cycle, AW first, W first, reads) and
# throughput (1 per 3 cycles with a master waiting for each response; pipelined master
# measured), then N_WR + N_RD random transactions (AW / W orders, random gaps, B / R
# backpressure profiles, random resets in flight), cycle model + scoreboards + latency rule.
# Labels: a12 / a32 / a3 = ADDR_W; q = quick tier. bad*: illegal parameters rejected at
# elaboration.
TOP=tb_axil_slave
RTL_FILES="l4/axil_slave.sv"
TB_FILES="common/tb_util_pkg.sv l4/tb_axil_slave.sv"
DPI=0
RUNS=(
  "a12|-gADDR_W=12 +SEED=501 +N_WR=60000 +N_RD=60000|pass"
  "a32|-gADDR_W=32 +SEED=502 +N_WR=60000 +N_RD=60000|pass"
  "a3|-gADDR_W=3 +SEED=503 +N_WR=60000 +N_RD=60000 +RST_PERMIL=10|pass"
  "q|-gADDR_W=12 +SEED=504 +N_WR=6000 +N_RD=6000 +RST_PERMIL=10 +PROF_LEN=500|pass|q"
  "badaddr2|-gADDR_W=2|elab_fail:axil_slave: ADDR_W=2 not supported|q"
  "badaddr33|-gADDR_W=33|elab_fail:axil_slave: ADDR_W=33 not supported"
  "baddata|-gDATA_W=64|elab_fail:axil_slave: DATA_W=64 not supported|q"
)
