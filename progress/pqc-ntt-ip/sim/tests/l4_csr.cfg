# pqc_ntt_csr (L4) alone: register file against a cycle reference model written from
# docs/spec/l4_axi.md (tb/l4/tb_pqc_ntt_csr.sv). The register access strobes and the ntt_core
# side (busy / done / result_bank, s_ready, m_valid / m_data from a model of the ntt_core
# contract, ops shortened except the first LONG_OPS) are driven by the TB; start / op / bank,
# s_valid / s_data, m_ready are checked every cycle, rd_data on every read. Same-cycle
# collisions (done x CTRL write, ERR set x W1C, read x write, ...) are counted and must occur.
# Ends with a CYCLES saturation test (counter forced near 2^32 - 1).
# Parameter sets (VERSION / CONFIG values and the address width):
#   pa: ALGO=2 BFU_LATENCY=1 (PRE_REG=1), ROM_OUT_REG=1, FCLK 100, ADDR_W 12
#   pb: ALGO=1 BFU_LATENCY=5 (MUL_REG=1 RED_PIPE=3 OUT_REG=1), SHARE_ADDSUB=1, ROM_OUT_REG=0,
#       IMPL=1, FCLK 255, ADDR_W 5 (no unmapped addresses)
#   pc: ALGO=3 BFU_LATENCY=5 (PRE_REG=1 MUL_REG=1 RED_PIPE=2 OUT_REG=1), IMPL=0, FCLK 1, ADDR_W 32
#   p0: every parameter at its default (ALGO=0, BFU_LATENCY=0, ROM_OUT_REG=1, FCLK 100, ADDR_W 12)
# q = quick tier. bad*: illegal parameters rejected at elaboration.
TOP=tb_pqc_ntt_csr
RTL_FILES="pkg/mlkem_pkg.sv l2/ntt_l2_pkg.sv l4/pqc_ntt_csr.sv"
TB_FILES="common/tb_util_pkg.sv l4/tb_pqc_ntt_csr.sv"
DPI=0
PA="-gADDR_W=12 -gALGO=2 -gPRE_REG=1 -gMUL_REG=0 -gRED_PIPE=0 -gOUT_REG=0 -gSHARE_ADDSUB=0 -gROM_OUT_REG=1 -gIMPL=0 -gFCLK_MHZ=100"
PB="-gADDR_W=5 -gALGO=1 -gPRE_REG=0 -gMUL_REG=1 -gRED_PIPE=3 -gOUT_REG=1 -gSHARE_ADDSUB=1 -gROM_OUT_REG=0 -gIMPL=1 -gFCLK_MHZ=255"
PC="-gADDR_W=32 -gALGO=3 -gPRE_REG=1 -gMUL_REG=1 -gRED_PIPE=2 -gOUT_REG=1 -gSHARE_ADDSUB=0 -gROM_OUT_REG=1 -gIMPL=0 -gFCLK_MHZ=1"
RUNS=(
  "pa|$PA +SEED=601 +N_CYC=200000|pass"
  "pb|$PB +SEED=602 +N_CYC=200000|pass"
  "pc|$PC +SEED=603 +N_CYC=200000 +WORDS_MAX=3 +WAIT_MAX=6|pass"
  "p0|+SEED=604 +N_CYC=200000 +WORDS_MAX=16 +WAIT_MAX=40|pass"
  "q|$PA +SEED=605 +N_CYC=30000|pass|q"
  "badaddr|-gADDR_W=4|elab_fail:pqc_ntt_csr: ADDR_W=4 not supported|q"
  "badalgo|-gALGO=4|elab_fail:pqc_ntt_csr: ALGO=4 not supported|q"
  "badimpl|-gIMPL=2|elab_fail:pqc_ntt_csr: IMPL=2 not supported"
  "badfclk0|-gFCLK_MHZ=0|elab_fail:pqc_ntt_csr: FCLK_MHZ=0 does not fit|q"
  "badfclk|-gFCLK_MHZ=256|elab_fail:pqc_ntt_csr: FCLK_MHZ=256 does not fit"
  "badred|-gRED_PIPE=4|elab_fail:pqc_ntt_csr: a pipeline parameter does not fit"
  "badpre|-gPRE_REG=2|elab_fail:pqc_ntt_csr: a pipeline parameter does not fit"
)
