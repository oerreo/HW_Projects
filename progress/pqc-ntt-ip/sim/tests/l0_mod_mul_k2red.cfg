# mod_mul ALGO=3 (k2red): exhaustive Q^2 over a, b in [0, Q) against the golden
# k2red_reduce(a * b) via DPI-C, for all 6 (MUL_REG, RED_PIPE) combinations.
# Label mXrY: MUL_REG=X, RED_PIPE=Y, LATENCY = X + Y.
TOP=tb_mod_mul
RTL_FILES="pkg/mlkem_pkg.sv l0/mod_red_barrett.sv l0/mod_red_mont12.sv l0/mod_red_shiftadd.sv l0/mod_red_k2red.sv l0/mod_red.sv l0/mod_mul.sv"
TB_FILES="common/tb_util_pkg.sv common/mlkem_dpi_pkg.sv l0/tb_mod_mul.sv"
DPI=1
RUNS=(
  "m0r0|-gALGO=3 -gMUL_REG=0 -gRED_PIPE=0 +SEED=1 +GAP_PCT=0|pass"
  "m1r0|-gALGO=3 -gMUL_REG=1 -gRED_PIPE=0 +SEED=1 +GAP_PCT=25|pass"
  "m0r1|-gALGO=3 -gMUL_REG=0 -gRED_PIPE=1 +SEED=1 +GAP_PCT=25|pass"
  "m1r1|-gALGO=3 -gMUL_REG=1 -gRED_PIPE=1 +SEED=1 +GAP_PCT=25|pass"
  "m0r2|-gALGO=3 -gMUL_REG=0 -gRED_PIPE=2 +SEED=1 +GAP_PCT=25|pass"
  "m1r2|-gALGO=3 -gMUL_REG=1 -gRED_PIPE=2 +SEED=1 +GAP_PCT=25|pass"
  "oor|-gALGO=3 -gMUL_REG=1 -gRED_PIPE=1 +SEED=1 +OOR_TEST|oor:3"
  "badmul|-gALGO=3 -gMUL_REG=2 -gRED_PIPE=0|elab_fail:mod_mul: MUL_REG=2 not supported"
  "badred|-gALGO=3 -gMUL_REG=0 -gRED_PIPE=3|elab_fail:mod_mul: RED_PIPE=3 not supported"
)
