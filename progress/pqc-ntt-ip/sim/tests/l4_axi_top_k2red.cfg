# pqc_ntt_axi_top (L4) ALGO=3 (k2red): AXI4-Lite slave + register file + ntt_core, driven by the
# AXI4-Lite BFM of tb/l4/tb_pqc_ntt_axi_top.sv in the order of the PS driver (fpga/sw/pqc_ntt.c),
# against the golden model (DPI-C), the external vectors and a cycle model of the register file.
# Labels: comb = every pipeline parameter 0 (bfu combinational, ROM_OUT_REG=0), max = PRE_REG=1
# MUL_REG=1 RED_PIPE=2 OUT_REG=1 SHARE_ADDSUB=1 ROM_OUT_REG=1 (largest LATENCY); IMPL / FCLK_MHZ
# only change the CONFIG register value.
# Default vector set: 32 external NTT / INTT / basemul, 8 random per op, 24 directed per op,
# 4 model + 4 random products in both orders (with and without host round trip), plus the
# register / error / collision / reset scenarios. full = all external vectors (855 / 450 / 2145).
# q_* = quick tier (8 external per op, 2 random, 4 directed, 1 + 1 products).
# err = register / error scenarios only, with din_range: 2 words >= Q enter the core, so the
# ntt_core assertion L3_RANGE fires exactly 2 times; writes an access trace (err.trc) that the
# host register model replays (fpga/sw/test). bad*: illegal parameters rejected at elaboration.
TOP=tb_pqc_ntt_axi_top
RTL_FILES="pkg/mlkem_pkg.sv l0/mod_add.sv l0/mod_sub.sv l0/mod_half.sv l0/mod_red_barrett.sv l0/mod_red_mont12.sv l0/mod_red_shiftadd.sv l0/mod_red_k2red.sv l0/mod_red.sv l0/mod_mul.sv l1/bfu.sv l2/ntt_l2_pkg.sv l2/rom/zeta_rom_pkg.sv l2/zeta_rom.sv l2/coef_ram.sv l2/ntt_ctrl.sv l3/ntt_core.sv l4/axil_slave.sv l4/pqc_ntt_csr.sv l4/pqc_ntt_axi_top.sv"
TB_FILES="common/tb_util_pkg.sv common/mlkem_dpi_pkg.sv l4/tb_pqc_ntt_axi_top.sv"
DPI=1
COMB="-gALGO=3 -gPRE_REG=0 -gMUL_REG=0 -gRED_PIPE=0 -gOUT_REG=0 -gSHARE_ADDSUB=0 -gROM_OUT_REG=0 -gIMPL=0 -gFCLK_MHZ=100"
MAX="-gALGO=3 -gPRE_REG=1 -gMUL_REG=1 -gRED_PIPE=2 -gOUT_REG=1 -gSHARE_ADDSUB=1 -gROM_OUT_REG=1 -gIMPL=1 -gFCLK_MHZ=250"
MID="-gALGO=3 -gPRE_REG=0 -gMUL_REG=1 -gRED_PIPE=1 -gOUT_REG=1 -gSHARE_ADDSUB=0 -gROM_OUT_REG=1 -gIMPL=0 -gFCLK_MHZ=125"
QUICK="+N_EXT_NTT=8 +N_EXT_INTT=8 +N_EXT_BM=8 +N_RAND=2 +N_DIR=4 +N_MPM=1 +N_CHAIN=1"
RUNS=(
  "comb|$COMB +SEED=461|pass"
  "max|$MAX +SEED=462|pass"
  "full|$MID +SEED=463 +N_EXT_NTT=855 +N_EXT_INTT=450 +N_EXT_BM=2145 +N_RAND=16 +N_MPM=16 +N_CHAIN=8|pass"
  "q_comb|$COMB +SEED=464 $QUICK +TRACE=q_comb.trc|pass|q"
  "q_max|$MAX +SEED=465 $QUICK +MAXD=8|pass|q"
  "err|$MID +SEED=466 +ERR_TEST +TRACE=err.trc|assert:L3_RANGE=2|q"
  "badimpl|-gALGO=3 -gIMPL=2|elab_fail:pqc_ntt_csr: IMPL=2 not supported|q"
  "badfclk|-gALGO=3 -gFCLK_MHZ=256|elab_fail:pqc_ntt_csr: FCLK_MHZ=256 does not fit|q"
  "badred|-gALGO=3 -gRED_PIPE=3|elab_fail:bfu: RED_PIPE=3 not supported|q"
)
