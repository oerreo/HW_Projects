# ntt_core (L3) ALGO=0 (barrett): core with ntt_ctrl, coef_ram x2, zeta_rom, bfu and the
# datapath glue, against the golden model (DPI-C) and the external vectors, polynomial
# by polynomial through the LOAD / UNLOAD streams (tb/l3/tb_ntt_core.sv).
# Label <cfg>_r<ROM_OUT_REG>, cfg = pPmMrRoO (bfu PRE_REG, MUL_REG, RED_PIPE, OUT_REG,
# LATENCY = P + M + R + O), prefix s_ = SHARE_ADDSUB = 1 (not with LATENCY D = P + M + R = 0).
# Every configuration run uses the full vector set: all external vectors (855 NTT, 450
# INTT, 2145 basemul pairs), N_RAND = 1000 random polynomials (pairs) per op, 24 directed
# per op (72 basemul pairs), 32 + 32 round trips, 106 model + 32 random polynomial
# products. Streams: GAP_PCT = RDY_PCT = 30 % on every other test (60 % in s_p1m0r0o1_r0).
# Quick tier (4th field q): q_* = same checks with +N_EXT_NTT=40 +N_EXT_INTT=40 +N_EXT_BM=40 +N_RAND=10 +N_RT=4 +N_CHAIN=2 +N_MPM=8.
# oor: three input words >= Q, L3_RANGE must fire 3 times. bad*: illegal parameters
# rejected at elaboration by the sub-modules.
TOP=tb_ntt_core
RTL_FILES="pkg/mlkem_pkg.sv l0/mod_add.sv l0/mod_sub.sv l0/mod_half.sv l0/mod_red_barrett.sv l0/mod_red_mont12.sv l0/mod_red_shiftadd.sv l0/mod_red_k2red.sv l0/mod_red.sv l0/mod_mul.sv l1/bfu.sv l2/ntt_l2_pkg.sv l2/rom/zeta_rom_pkg.sv l2/zeta_rom.sv l2/coef_ram.sv l2/ntt_ctrl.sv l3/ntt_core.sv"
TB_FILES="common/tb_util_pkg.sv common/mlkem_dpi_pkg.sv l3/tb_ntt_core.sv"
