# Quick tier (sim/run.sh quick): runs whose 4th field is q.
# mod_half: exhaustive over [0, Q) against golden mod_half via DPI-C, plus the
# defining property h < Q and 2h mod Q == x as an auxiliary check.
TOP=tb_mod_half
RTL_FILES="pkg/mlkem_pkg.sv l0/mod_half.sv"
TB_FILES="common/tb_util_pkg.sv common/mlkem_dpi_pkg.sv l0/tb_mod_half.sv"
DPI=1
RUNS=(
  "pipe0|-gPIPE=0 +SEED=1 +GAP_PCT=0 +REPEAT=1|pass|q"
  "pipe1|-gPIPE=1 +SEED=1 +GAP_PCT=25 +REPEAT=16|pass|q"
  "oor|-gPIPE=1 +SEED=1 +OOR_TEST|oor:3|q"
  "badpipe|-gPIPE=2|elab_fail:PIPE=2 not supported|q"
)
