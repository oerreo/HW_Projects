# R1b: 802.3an at 4.0 dB with an independent seed (R1 4.0 dB was about 2 sigma below the references)
code ../data/third_party/alist/eth_1723_2048.alist
chan awgn
zero_cw 1
pts 4.0
decs ref:nms:flood:a=0.5:it=30 ref:spa:flood:it=100
stop_dec 0
max_fe 300
max_sec 2400
seed 202
out results/r1b_eth.txt
ckpt results/r1b.ck
