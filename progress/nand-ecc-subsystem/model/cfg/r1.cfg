# R1: IEEE 802.3an (2048,1723) vs AFF3CT reference curves (error_rate_references, AZCW, AWGN BPSK)
code ../data/third_party/alist/eth_1723_2048.alist
chan awgn
zero_cw 1
pts 3.4 3.6 3.8 4.0
decs ref:spa:flood:it=100 ref:spa:layer:it=100 ref:nms:flood:a=0.5:it=30
stop_dec 1
max_fe 100
max_sec 1800
seed 101
out results/r1_eth.txt
ckpt results/r1.ck
