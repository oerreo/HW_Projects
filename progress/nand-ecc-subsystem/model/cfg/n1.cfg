pe 3000
page 0
sense 1
dstep 2
lut_scale 2.0
lut_w 6
hardA 15
pts 1.2 1.3 1.4 1.5 1.6 1.7
decs fix:w=6,7,8:nms=12:it=20:et=a ref:nms:layer:a=0.75:it=20 fix:w=6,6,8:nms=12:it=20:et=a bch
stop_dec 0
max_fe 50
max_sec 500
seed 11
out results/n1_tlc.txt
ckpt results/n1.ck
