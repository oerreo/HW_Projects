# N1: own code m128 on the TLC fit channel ([R5] P/E 3000, 30 days, LSB page), sigma scale alpha sweep,
# sense levels per boundary 1 (1 = hard, LLR +-15), LUT matched to the channel, scale 2.0, 6 bit
code code/qc_m128.txt
chan tlc
tlc_tab ../data/params/tlc_cui2021.txt
